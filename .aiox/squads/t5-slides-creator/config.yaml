checklists:
  - presentation-readiness-checklist

templates:
  - README

# Dependencies
dependencies:
  frameworks:
    - name: "React"
      version: ">=18.0.0"
      purpose: "TSX component rendering"
    - name: "Framer Motion"
      version: ">=10.0.0"
      purpose: "Animation presets (7 presets)"
    - name: "TypeScript"
      version: ">=5.0.0"
      purpose: "Type safety for slide components"
    - name: "Next.js"
      version: ">=16.0.0"
      purpose: "ds app surface integration"
  mcp_servers:
    - name: "exa"
      purpose: "Image search for visual-scout agent"
  data:
    - name: "Template Registry"
      purpose: "Canonical mirror of the 56 implemented ds slide templates with provenance"
      location: "data/template-registry.yaml"
    - name: "Asset Resolution"
      purpose: "Fallback chain, degraded policy, and blocked visual anti-patterns"
      location: "data/asset-resolution.yaml"
    - name: "SOP-SLIDES-003"
      purpose: "Core brand-agnostic reference for slide generation"
      location: "data/SOP-SLIDES-003.md"
    - name: "SOP-SLIDES-001"
      purpose: "Rules and quality gates reference"
      location: "data/SOP-SLIDES-001.md"
  app_surfaces:
    - name: "consumer_tsx_app"
      purpose: "Any consumer React/Next.js app conforming to tech_discipline in slide-component-vocabulary.yaml"
      resolution: "runtime-declared via config.yaml#render_targets"
      status: "contract_based"

# SINKRA v3.2 — Artifact Contracts (Wave 3 — expanded for 16 workflow outputs)
# Each contract: producer/consumer/lifecycle + transition rules
artifact_contracts:
  # === Canonical existing contracts ===
  - artifact_id: normalized-briefing
    template_path: templates/briefing.normalized.json
    lifecycle_states: [draft, validated, approved]
    producer: normalize-briefing
    consumer: [catalog-sources-apa, distill-governing-thought, build-pyramid]
    transition_rules:
      draft_to_validated: "schema valid + all required fields present"
      validated_to_approved: "P00 gate implicit (no rework)"

  - artifact_id: deck-manifest
    template_path: templates/deck-manifest.json
    lifecycle_states: [draft, validated, approved]
    producer: create-presentation
    consumer: [Human reviewer]
    transition_rules:
      draft_to_validated: "qa_verdict == PASS"
      validated_to_approved: "Human review verdict == APPROVED"

  - artifact_id: qa-report
    template_path: templates/qa-report.json
    lifecycle_states: [draft, validated, approved]
    producer: qa-inspector
    consumer: [qa_verdict gate, dimension_router, Human reviewer]
    transition_rules:
      draft_to_validated: "all 6 validators emitted"
      validated_to_approved: "qa_verdict gate PASS"

  # === Narrative outputs (P01-P02) ===
  - artifact_id: sources-apa
    template_path: inline
    lifecycle_states: [draft, validated, approved]
    producer: catalog-sources-apa
    consumer: [validate-fontes-apa, p1-fidelity-sampling]
    schema_ref: "APA schema: {org, title, date, url, access_date}"

  - artifact_id: governing-thought
    template_path: inline
    lifecycle_states: [draft, validated]
    producer: distill-governing-thought
    consumer: [build-pyramid]

  - artifact_id: pyramid-tree
    template_path: inline
    lifecycle_states: [draft, validated, approved]
    producer: build-pyramid
    consumer: [write-action-titles, classify-slide-type, validate-pyramid, emit-deck-spec]
    schema_ref: data/checkpoint-schema.yaml
    invariant_enforced: [P3]

  - artifact_id: scqa-map
    template_path: inline
    lifecycle_states: [draft, validated, approved]
    producer: apply-scqa
    consumer: [write-action-titles, validate-vertical-flow]

  - artifact_id: vertical-test-result
    template_path: inline
    lifecycle_states: [draft, validated]
    producer: run-vertical-test
    consumer: [D02_gate]
    cross_session: true

  # === Spec outputs (P03-P04) ===
  - artifact_id: grid-layouts
    template_path: inline
    lifecycle_states: [draft, validated]
    producer: compose-grid-layout
    consumer: [emit-deck-spec]

  - artifact_id: active-palette
    template_path: inline
    lifecycle_states: [draft, approved]
    producer: resolve-active-palette
    consumer: [compose-grid-layout, emit-deck-spec, handoff-render-request]
    co_sign_on_override: STK-10

  - artifact_id: deck-spec
    template_path: inline
    lifecycle_states: [draft, validated, approved]
    producer: emit-deck-spec
    consumer: [P05 validators, handoff-render-request, create-presentation]
    invariant_enforced: [P2, P5]
    schema_ref: "hex/grid_coord/pt_size required per slide"

  # === Release outputs (P06) ===
  - artifact_id: render-request
    template_path: inline
    lifecycle_states: [draft, validated, approved]
    producer: handoff-render-request
    consumer: ["consumer_tsx_app (resolved per render_targets); LLM-direct fallback"]
    handoff_token: BC-08_RENDER_REQUEST

  - artifact_id: slide-specifications
    template_path: "deliverables/Slide_Specifications.md"
    lifecycle_states: [draft, validated, approved]
    producer: create-presentation
    consumer: [Human reviewer, audience]

  - artifact_id: design-system-doc
    template_path: "deliverables/Design_System.md"
    lifecycle_states: [draft, validated, approved]
    producer: create-presentation
    consumer: [Human reviewer]

  - artifact_id: references-bibliography
    template_path: "deliverables/References_Bibliography.md"
    lifecycle_states: [draft, validated, approved]
    producer: catalog-sources-apa + create-presentation
    consumer: [Human reviewer, audience]
    invariant_enforced: [P6]

  - artifact_id: ai-image-prompts
    template_path: "deliverables/AI_Image_Prompts.md"
    lifecycle_states: [draft, validated, approved]
    producer: create-presentation
    consumer: [visual-scout, Human reviewer]
    invariant_enforced: [P7]

  - artifact_id: version-history
    template_path: "deliverables/Version_History.md"
    lifecycle_states: [draft, approved]
    producer: create-presentation
    consumer: [Human reviewer]

bu_mapping: "hub-framework"

supported_modes:
  - CRIAR
  - VALIDAR
  - RESOLVER

# ═══════════════════════════════════════════════════════════════════════════════
# COMPOSITION MAPPING (SINKRA v3.2 — GAP-003 closure)
# ═══════════════════════════════════════════════════════════════════════════════
composition_mapping:
  atoms:
    narrative:
      - tasks/catalog-sources-apa.md
      - tasks/distill-governing-thought.md
      - tasks/build-pyramid.md
      - tasks/apply-scqa.md
      - tasks/write-action-titles.md
      - tasks/run-vertical-test.md
    spec:
      - tasks/classify-slide-type.md
      - tasks/select-chart-type.md
      - tasks/compose-grid-layout.md
      - tasks/emit-deck-spec.md
    brand:
      - tasks/detect-brand-override.md
      - tasks/register-palette-override.md
      - tasks/resolve-active-palette.md
    qa:
      - tasks/validate-pyramid.md
      - tasks/validate-vertical-flow.md
      - tasks/validate-enumeration-universal.md
      - tasks/validate-fontes-apa.md
      - tasks/validate-action-title.md
      - tasks/p1-fidelity-sampling.md
    intake:
      - tasks/load-kb-bundle.md
      - tasks/normalize-briefing.md
      - tasks/youtube-to-briefing.md
    handoff:
      - tasks/handoff-render-request.md
      - tasks/prepare-ds-presenter.md
    crud:
      - tasks/create-presentation.md
      - tasks/review-presentation.md
      - tasks/update-slides-creator.md
      - tasks/delete-slides-creator.md
  molecules:
    - { id: MOL-NARR-PYRAMID, atoms: [catalog-sources-apa, distill-governing-thought, build-pyramid, apply-scqa, write-action-titles] }
    - { id: MOL-SPEC-EMISSION, atoms: [classify-slide-type, select-chart-type, compose-grid-layout, emit-deck-spec] }
    - { id: MOL-BRAND-RESOLUTION, atoms: [detect-brand-override, register-palette-override, resolve-active-palette] }
    - { id: MOL-QA-NARRATIVE, atoms: [validate-pyramid, validate-vertical-flow, validate-enumeration-universal, validate-fontes-apa, validate-action-title, p1-fidelity-sampling, run-vertical-test] }
    - { id: MOL-HANDOFF, atoms: [handoff-render-request, prepare-ds-presenter] }
  organisms:
    - { id: ORG-GENERATE-PRESENTATION, path: workflows/generate-presentation.yaml, molecules: [MOL-NARR-PYRAMID, MOL-SPEC-EMISSION, MOL-BRAND-RESOLUTION, MOL-QA-NARRATIVE, MOL-HANDOFF] }
  templates:
    - templates/briefing.normalized.json
    - templates/deck-manifest.json
    - templates/qa-report.json
    - templates/README.md
    - templates/slide-archetypes/  # 7 archetypal spec templates (Wave B absorption)
    - data/template-registry.yaml
  instances:
    location: "outputs/slides-creator/{run_id}/"
    retention_days: 30
    pattern: "Per-execution instances indexed by correlation_id"

