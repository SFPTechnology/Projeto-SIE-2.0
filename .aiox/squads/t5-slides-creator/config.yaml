pack:
  name: slides-creator
  version: "9.1.0"
  description: >-
    Squad de agents especializados que automatizam o ciclo completo de geracao
    de slide decks profissionais: do briefing a entrega validada. Brand-agnostic
    por design -- gera slides para qualquer marca via {{handlebars}} e CSS variables.
    Baseado em SOP-SLIDES-003 (brand-agnostic), PPTEval (Design, Content, Coherence, GAD)
    e absorção v9 da disciplina narrativa McKinsey (Pyramid + SCQA + Action Titles + APA).

absorption_source: outputs/sinkra-squad/criacao-slides-ia/

squad:
  name: slides-creator
  version: 9.1.0
  short-title: Slides Creator Squad
  description: >-
    Squad de agents especializados que automatizam o ciclo completo de geracao
    de slide decks profissionais: do briefing a entrega validada. Brand-agnostic
    por design -- gera slides para qualquer marca via {{handlebars}} e CSS variables.
    Baseado em SOP-SLIDES-003 (brand-agnostic) e PPTEval (Design, Content, Coherence, GAD).
  author: AIOX Community
  icon: "SC"
  entry_agent: slide-chief
  slashPrefix: SlidesCreator
  tested: true

metadata:
  # Canonical single-block metadata (MIGRATION-SCHEMA-001 legacy comment removed; collapsed duplicates)
  name: slides-creator
  status: active
  domain: slides-creator
  quality_score:
    value: 8.9
    scale: 0-10
    rubric: "internal AIOX assessment pre-upgrade"
    scored_at: "2026-04-18"
  # absorption_source removed (duplicate — canonical declaration at top-level line 11)

workspace_integration:
  level: controlled_runtime_consumer
  rationale: >-
    Slides Creator consumes brand context from the workspace and targets a consumer
    TSX application (resolved per deployment via config.yaml#render_targets). The squad
    does not own any specific app; readiness + handoff are gated by the operator.
    Designed portable — may ship into any repo without hard refs.
  read_paths:
    - workspace/_system/config.yaml
    - workspace/businesses/
  write_paths: []
  template_namespace: slides
  owner: "operator"
  execution_mode: "contract_based"   # consumer apps implement the contract; squad emits spec
  readiness_owner: "operator"
  delivery_targets: "resolved via config.yaml#render_targets at runtime"

# ═══════════════════════════════════════════════════════════════════════════════
# INVARIANTS (P1-P7) — absorbed from /sinkra-map-process criacao-slides-ia
# ═══════════════════════════════════════════════════════════════════════════════
# Canonical summary: data/principios-invioláveis.md
# Canonical source:  outputs/sinkra-squad/criacao-slides-ia/architecture.yaml#invariants
invariants:
  reference: data/principios-invioláveis.md
  items:
    - id: P1
      name: Fidelidade aos dados
      enforcement_level: code
      failure_mode: "Qualquer número/citação não rastreável à fonte = QA FAIL"
    - id: P2
      name: Especificação obsessiva
      enforcement_level: schema
      failure_mode: "SlideSpec sem hex/grid_coord/pt_size = schema validation FAIL"
    - id: P3
      name: Pyramid Principle + MECE
      enforcement_level: validator
      failure_mode: "Vertical test falha OU MECE violado = QA FAIL"
    - id: P4
      name: Action titles obrigatórios
      enforcement_level: validator
      failure_mode: "Título descritivo (ex: 'Análise de market share') = QA FAIL"
    - id: P5
      name: Enumeração universal
      enforcement_level: validator
      failure_mode: "Qualquer visual sem ID (Gráfico N, Tabela N.M) = QA FAIL"
    - id: P6
      name: Citação completa APA
      enforcement_level: schema
      failure_mode: "Citação sem {org, title, date, url, access_date} = schema FAIL"
    - id: P7
      name: Prompts de IA completos (10 componentes)
      enforcement_level: schema
      failure_mode: "Prompt IA com <10 componentes = schema FAIL"

# Pattern Library (SC-xxx)
pattern_library:
  prefix: SC
  naming_convention:
    format: "{PREFIX}-{CATEGORY}-{NUMBER}"
    example: "SC-TP-001"
  categories:
    - id: TP
      name: "Task Patterns"
      description: "Patterns for slide generation task structure"
    - id: EP
      name: "Executor Patterns"
      description: "Patterns for executor types and selection"
    - id: PP
      name: "Process Patterns"
      description: "Patterns for presentation workflow processes"
    - id: IP
      name: "Integration Patterns"
      description: "Patterns for brand config and template integration"
    - id: AP
      name: "Automation Patterns"
      description: "Patterns for automated slide generation"
    - id: DP
      name: "Documentation Patterns"
      description: "Patterns for slide documentation and SOPs"
  patterns: []

# Task Standards (SC-TP-001)
task_standards:
  enforce_anatomy: true
  validator: "SC-TP-001"
  required_fields:
    - task_name
    - status
    - responsible_executor
    - execution_type
    - input
    - output
    - action_items
    - acceptance_criteria
  optional_fields:
    - estimated_time
    - dependencies
    - templates
    - quality_gate
    - handoff

# Executor Types
executor_types:
  human:
    id: "SC-EP-001"
    name: "Human Executor"
    characteristics:
      - judgment
      - creativity
      - brand_alignment
    cost: "$$$"
    speed: slow
    use_for:
      - "Brand config definition"
      - "Briefing creation"
      - "Final visual approval"
  agent:
    id: "SC-EP-002"
    name: "Agent Executor (AI)"
    characteristics:
      - analysis
      - generation
      - pattern_recognition
    cost: "$$$$"
    speed: fast
    use_for:
      - "Outline generation"
      - "TSX component generation"
      - "Quality evaluation"
      - "Template matching"
  hybrid:
    id: "SC-EP-003"
    name: "Hybrid Executor"
    characteristics:
      - ai_assisted
      - human_validated
    cost: "$$"
    speed: moderate
    use_for:
      - "Content review"
      - "Visual QA"
      - "Brand compliance check"
  worker:
    id: "SC-EP-004"
    name: "Worker Executor"
    characteristics:
      - deterministic
      - api_integration
      - file_operations
    cost: "$"
    speed: very_fast
    use_for:
      - "Image search and validation"
      - "WCAG contrast calculation"
      - "Lint and typecheck execution"

executor_selection:
  requires_creativity: human
  requires_judgment: [human, hybrid]
  requires_speed: [agent, worker]
  requires_consistency: worker
  requires_validation: hybrid
  requires_learning: agent

# Workflow Configuration
workflow_config:
  checkpoint_policy: always_active
  checkpoint_modes:
    always_active: "Every checkpoint MUST pass"
    skip_on_override: "Can skip with manual approval"
    advisory: "Only alerts, doesn't block"
  fail_fast: true
  allow_manual_override: false

# ═══════════════════════════════════════════════════════════════════════════════
# QUALITY GATES (Numeric Thresholds)
# ═══════════════════════════════════════════════════════════════════════════════
quality_gates:
  - name: brand-token-compliance
    executor: Worker
    threshold: "token_usage >= 95% AND 0 custom violations"
    description: "Validates design token usage against brand config"
  - name: visual-regression
    executor: Worker
    threshold: "< 2% pixel diff from reference"
    description: "Pixel-level comparison with reference renders"
  - name: accessibility
    executor: Worker
    threshold: "0 WCAG AA violations"
    description: "Automated WCAG AA compliance scan"
  - name: ppteval-composite
    executor: Agent
    threshold: "Design >= 7, Content >= 7, Coherence >= 7, GAD >= 7"
    description: "PPTEval 4-dimension quality gate (existing slides-creator standard)"
  - name: human-visual-approval
    executor: Human
    threshold: "Explicit approval"
    required_for: "external-facing artifacts only"

# ═══════════════════════════════════════════════════════════════════════════════
# HANDOFF CONTRACT
# ═══════════════════════════════════════════════════════════════════════════════
handoff_contract:
  imports:
    - source: "workspace/businesses/{slug}/L2-tactical/brand/"
      provides: "Brand config (colors, fonts, spacing, logo)"
    - source: "data/template-registry.yaml"
      provides: "56 canonical slide templates with provenance"
    - source: "data/SOP-SLIDES-003.md"
      provides: "Brand-agnostic generation rules"
  exports:
    - "Rendered slide deck (TSX/HTML)"
    - "QA report (PPTEval scores)"
    - "Normalized briefing (JSON)"

settings:
  model_routing:
    default: sonnet
    creative_tasks: opus
    worker_tasks: haiku
  activation:
    show_context_report: true
    show_greeting: true
    show_quick_commands: true
    quick_commands_limit: 6
  preload:
    max_shared_files: 4
    max_brand_files: 4

tier_system:
  tier_0:
    description: Entry point and delivery gate
    agents:
      - slide-chief
  tier_1:
    description: Narrative, grounding, and template decisions
    agents:
      - content-architect
      - template-curator
  tier_2:
    description: Rendering, asset resolution, and critique orchestration
    agents:
      - design-renderer
      - visual-scout
      - design-planner  # MSN-2026 addition
  tier_3:
    description: Quality scoring and release veto
    agents:
      - qa-inspector

agents:
  - id: slide-chief
    title: "Squad Chief & Entry Gate"
    tier: tier_0
    phases: [P00, P01, P02, P03, P04, P05, P06]
    executor_profile:
      sinkra_type: Agent
      human_in_the_loop: true
      output_schema: "deliverable definido pela task ativa"
      story_role: "orchestrator"
      can_execute: true
      core_replaces: null
      work_contexts: ["intake", "orchestration", "release"]
      can_review: [content-architect, template-curator, design-renderer, visual-scout, qa-inspector]

  - id: content-architect
    title: "Narrative & Pyramid Architect"
    tier: tier_1
    phases: [P01, P02, P04]
    executor_profile:
      sinkra_type: Agent
      human_in_the_loop: true
      output_schema: "pyramid-tree.yaml, scqa-map.yaml, sources-apa.yaml, action-titles"
      story_role: "executor"
      can_execute: true
      core_replaces: null
      work_contexts: ["narrative", "sources", "action_titles"]
      session: SESSION-NARR
      can_review: []

  - id: template-curator
    title: "Template & Slide-Type Curator"
    tier: tier_1
    phases: [P00, P03]
    executor_profile:
      sinkra_type: Agent
      human_in_the_loop: true
      output_schema: "slide-type classification, template-selection-summary.md, chart-type mapping"
      story_role: "executor"
      can_execute: true
      core_replaces: null
      work_contexts: ["template_selection", "chart_selection", "reference_induction"]
      session: SESSION-SPEC
      can_review: []

  - id: design-renderer
    title: "Grid, Spec & Handoff Renderer"
    tier: tier_2
    phases: [P03, P04, P06]
    executor_profile:
      sinkra_type: Agent
      human_in_the_loop: true
      output_schema: "grid-layouts.yaml, deck-spec.yaml, render-request.yaml"
      story_role: "executor"
      can_execute: true
      core_replaces: null
      work_contexts: ["grid_composition", "spec_emission", "handoff"]
      session: SESSION-SPEC
      can_review: []

  - id: visual-scout
    title: "Brand Palette & Asset Resolver"
    tier: tier_2
    phases: [P03]
    executor_profile:
      sinkra_type: Agent
      human_in_the_loop: true
      output_schema: "active-palette.yaml, asset-resolution.json"
      story_role: "executor"
      can_execute: true
      core_replaces: null
      work_contexts: ["brand_override_detection", "palette_resolution", "asset_search"]
      session: SESSION-SPEC
      can_review: []

  - id: qa-inspector
    title: "Quality Gate & Invariant Validator"
    tier: tier_3
    phases: [P02, P05]
    executor_profile:
      sinkra_type: Agent
      human_in_the_loop: true
      output_schema: "qa-report.json, vertical-test-result.yaml, validator outputs"
      story_role: "reviewer"
      can_execute: true
      core_replaces: null
      work_contexts: ["validation", "ppteval", "vertical_test", "invariant_enforcement"]
      session: SESSION-QA
      can_review: [content-architect, design-renderer, template-curator, design-planner]

  - id: design-planner
    title: "Design Critique Planner & Critique Loop Orchestrator"
    tier: tier_2
    phases: [P04_5]
    mission_origin: "MSN-2026-SLIDES-NARRATIVE-DESIGN (T-015)"
    executor_profile:
      sinkra_type: Agent
      human_in_the_loop: true
      output_schema: "critique-report.yaml, planning-reflection.jsonl entries"
      story_role: "reviewer"
      can_execute: true
      core_replaces: null
      work_contexts: ["critique_orchestration", "design_routing", "iteration_management"]
      session: SESSION-DESIGN-CRITIQUE
      can_review: [design-renderer, visual-scout]

