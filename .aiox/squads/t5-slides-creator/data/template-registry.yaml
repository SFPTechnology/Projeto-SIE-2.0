registry:
  id: slides-creator-template-registry
  version: 1.1.0
  mirrored_at: 2026-03-16
  canonical_runtime_source: apps/ds/src/components/brandbook/slides/registry.ts
  canonical_runtime_source_status: implemented
  total_templates: 61
  category_counts:
    ESTRUTURA: 12
    CONTEUDO: 13
    DADOS: 14
    VISUAL: 18
    BRAND: 4
  decision_notes:
    - "The canonical inventory source is the implemented ds runtime registry."
    - "The legacy 7-category split in docs/projects/slides-creator-prd.md remains supporting evidence only."
    - "Mirrored entries use version registry-tsx-v1 until an explicit promotion flow lands."
    - "Manifest slide_type values may arrive in content-contract aliases and must be normalized before category lookup."
  governance_notes:
    - id: GOV-001
      subject: "QUOTE is content_variant, not canonical slide_type"
      decision: >-
        QUOTE is NOT one of the 11 canonical slide types defined in SOP-SLIDES-001.
        Incoming QUOTE requests are normalized to CONTENT or STATEMENT with
        content_variant=quote. The SlideQuote runtime component remains in the
        registry as a valid template binding target for slides carrying the quote
        variant. This decision resolves the incoherence between SOP-SLIDES-003
        (which listed QUOTE as a direct type) and the canonical 11-type system.
      authority: "content-architect governance_resolution.contradiction_001"
      recorded_at: 2026-03-19
  slide_type_aliases:
    SECTION-BREAK: SECTION_BREAK
    DATA-VIZ: DATA_VIZ
  slide_type_category_map:
    TITLE: [ESTRUTURA, BRAND]
    SECTION_BREAK: [ESTRUTURA]
    STATEMENT: [ESTRUTURA, BRAND, CONTEUDO]
    CONTENT: [CONTEUDO, VISUAL]
    COMPARISON: [DADOS, CONTEUDO]
    METRIC: [DADOS]
    DATA_VIZ: [DADOS]
    IMAGE: [VISUAL]
    BUILD: [CONTEUDO, DADOS]
    CODE: [CONTEUDO]
    CLOSING: [ESTRUTURA, BRAND]
  selection_policy:
    normalize_aliases_before_lookup: true
    registry_first_when:
      - no reference_assets are present
      - a valid template_id already exists in the manifest
    reference_first_when:
      - screenshots are present
      - PPTX reference assets are present
      - visual fidelity is explicitly prioritized
    no_silent_overwrite: true
