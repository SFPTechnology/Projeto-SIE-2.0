# Pipeline Execution Log — Copy Squad
# Records execution history for observability (Mandamento 10)

meta:
  squad: copy
  version: "1.0.0"
  created_date: "2026-04-12"
  created_by: "/sinkra-upgrade-squad"
  schema: "pipeline-execution-log-v1"

schema:
  fields:
    - execution_id: "EXE-CP-NNN"
    - workflow_ref: "workflow ID"
    - business_slug: "target business"
    - started_at: "ISO-8601"
    - completed_at: "ISO-8601"
    - duration_seconds: "integer"
    - status: "completed | failed | aborted"
    - phases_executed: "list of phase IDs"
    - agents_activated: "list of agent IDs"
    - tokens_produced: "list of token IDs"
    - quality_gate_results: "map of gate_id → verdict"
    - meta_axiomas_overall: "float 0-10"
    - deviations: "list of deviation IDs from deviation-register"
    - output_artifacts: "list of output file paths"

