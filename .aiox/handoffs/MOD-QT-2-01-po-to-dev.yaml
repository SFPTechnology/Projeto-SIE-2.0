dev_must_know:
  - id: "DEV-01"
    topic: "Gate zero"
    note: >-
      CA-QT-19 (AC17) é o PRIMEIRO teste a escrever e rodar. Nada mais avança até ele passar
      ou até a divergência ter causa normativa escrita no Dev Agent Record. Proibido ajustar
      valor para forçar aprovação (R-09). Baseline do mock a reproduzir:
      DV% = 2 * 0.0172 * L * I / (S * 220) * 100.
  - id: "DEV-02"
    topic: "Contexto ausente no schema de request"
    note: >-
      ValidarMODQTSchema NÃO carrega material, isolacao, num_fases, fp_carga nem tensao_v.
      A saída aprovada é a da Task 2.3: valores padrão documentados (Cu/PVC/trifásico/220V)
      quando o contexto do circuito não vier na chamada. NÃO estender o schema. Um diff em
      otimizar-condutor.schema.ts ou contratos.ts é FAIL automático no gate de QA (RSK-2).
  - id: "DEV-03"
    topic: "Armadilha de teste do AC16"
    note: >-
      RetornoMODQTSchema é z.object não-estrito — descarta chaves extras em vez de rejeitá-las.
      O teste de AC16 (CA-QT-18) deve comparar o conjunto de chaves do objeto ANTES do parse,
      ou usar .strict() no teste. Passar pelo safeParse do handler NÃO prova ausência de campo extra (RSK-6).
  - id: "DEV-04"
    topic: "Fronteira CONFIRMADO x [VERIFICAR]"
    note: >-
      A tabela de limites §13.1 (4% / 5% / 7%) e o limite EDP 1% do §13.8 são CONFIRMADOS —
      codificá-los assim está correto. O que é [VERIFICAR] é qual alínea da 6.2.7.1 se aplica
      ao modelo EDP-SP (VER-QT-07). Selecionar 5% ou 7% para projeto EDP-SP sem marcar
      "[VERIFICAR — alínea 6.2.7.1]" no campo fonte viola AC20 e o Artigo IV.
  - id: "DEV-05"
    topic: "Preservação do comportamento existente do endpoint"
    note: >-
      Manter timeout de 5s (Promise.race + AbortSignal), persistência via
      retornosDownstream.registrar, os códigos de erro mod_qt_timeout/mod_qt_erro/mod_qt_contrato_invalido,
      e os helpers _setClienteModQTParaTeste/_resetClienteModQTParaTeste. Substituir apenas
      a implementação por trás de ClienteModQT.validar.
  - id: "DEV-06"
    topic: "Fatiamento permitido"
    note: >-
      Núcleo indivisível = Tasks 1-3 (motor + substituição do mock + não-regressão).
      Se a Task 4 (simulador + UI) ameaçar o gate técnico, ela pode virar MOD-QT-2-02 —
      decisão de @dev/@qa durante a execução, documentada; não requer nova validação de @po.
  - id: "DEV-07"
    topic: "Build SPA"
    note: >-
      Novas rotas UI exigem revisão manual de src/routeTree.spa.ts (mantido à mão), além do
      routeTree.gen.ts regenerado. npm run build faz parte do gate (RSK-8).

