# ---------------------------------------------------------------------------
# DECISOES DE @po — FECHADAS. @dev implementa conforme abaixo e NAO reabre.
# ---------------------------------------------------------------------------
decisions_closed:
  - id: PO-01
    question: "fonte_id: parecer §3.1 exige PRYSMIAN_BT_REV10; artefato grava PRYSMIAN_BT_GUIA nos 1.563 registros."
    decision: "Ancoragem dupla — o hash SHA-256 e a IDENTIDADE, o rotulo e o IDENTIFICADOR."
    rules:
      - "fonte_id = 'PRYSMIAN_BT_REV10' (literal do parecer)."
      - "fonte_sha256 = '82131cb4aa4b2c66c4835a8fd71bb18bfe72266e0fae1f48b3cc3f05c06ea54a' e fonte_url sao campos OBRIGATORIOS do catalogo (AC3)."
      - "versao_fonte NAO pode afirmar 'REV10' como fato. Redacao obrigatoria: 'REV10 — rotulo declarado no nome do arquivo da URL oficial; nao repetido na capa nem nos metadados internos do PDF (criacao 2020-09-22). Identidade verificavel: SHA-256 82131cb4...'"
      - "O remapeamento PRYSMIAN_BT_GUIA -> PRYSMIAN_BT_REV10 e renomeacao de rotulo, NAO transformacao de valor. Nenhuma celula Rca/XL e tocada. Registrar no Dev Agent Record com a contagem (1.563)."
      - "Teste obrigatorio: falha se fonte_sha256 divergir do valor acima (parecer §5.1)."
    rationale: >
      O parecer e a fonte decisoria superior e o §3.2 compoe perfil_id com esse literal;
      troca-lo divergiria da definicao de perfil_id e do formato de citacao do §6 C-01
      (que escreve 'Rev. 10' por extenso). Mas o Relatorio §1 prova que 'Rev. 10' consta
      APENAS no nome do arquivo da URL — afirma-lo como revisao confirmada violaria o
      Artigo IV. As duas informacoes andam juntas; nenhuma sozinha e suficiente.
    artigo_iv: "Respeitado — a revisao e declarada como proveniencia, nunca como fato confirmado."

  - id: PO-02
    question: "Existe familia de cabo padrao do projeto? (Relatorio §7 item 2)"
    decision: "NAO existe padrao. Selecao obrigatoria; ausencia e rejeicao (fail-closed)."
    rules:
      - "Nenhuma familia e default. O formulario NAO pre-seleciona nem oferece 'padrao do projeto'."
      - "Catalogo armazena 1.563 registros com familia_grupo_id = rotulo literal (9 grupos), fiel 1:1 as celulas publicadas."
      - "familia_id comercial (13, parecer §3.1) e ALIAS de selecao com mapa N:1 declarado para familia_grupo_id."
      - "perfil_id compoe-se com familia_grupo_id, NUNCA com o alias comercial (evita perfil_id duplicado para a mesma celula)."
      - "O familia_id selecionado e gravado no rastreio, para a citacao de fonte refletir o produto escolhido."
    fixture_ca_qt_19: >
      Os 504 vetores legados recebem, como dado de TESTE declarado e sem efeito em producao,
      familia_grupo_id = 'Superastic (cobre)' (tabela 28) e topologia_coluna_id =
      '2_UNIPOLARES_JUSTAPOSTOS'. Base: Relatorio §4.3 demonstra numericamente que a tabela
      provisoria correspondia ao Superastic Cu (2,5/4/10/16/25 mm2 identicos). Continuidade
      baseada em evidencia, nao escolha arbitraria. Declarar em constante nomeada citando esta decisao.
    rationale: >
      Um default significaria o sistema escolher silenciosamente o produto de um fabricante
      pelo engenheiro, dimensionando o projeto contra um cabo que o projetista nunca selecionou —
      exatamente a 'resistencia generica' que o parecer abole (§3.1, §3.2, §4).
    verificacao_po: >
      Separar em 13 familias comerciais produziria 2.286 registros, quebrando o AC1 (1.563).
      Verificado no artefato: 9 rotulos literais, 4 dos quais compostos, porque as familias
      COMPARTILHAM a mesma celula publicada.

  - id: PO-03
    question: "Vincular a base de producao a um unico fabricante (Prysmian) e aceitavel? (Relatorio §7 item 3)"
    decision: "SIM, aceitavel nesta rodada — com consequencia declarada e obrigatoria."
    consequences_in_scope:
      - "fonte_id e COLUNA DISCRIMINADORA do registro, NUNCA constante embutida em tipo, assinatura de funcao ou filtro do resolvedor. Um segundo fabricante deve poder ser adicionado sem alterar schema, resolvedor ou motor. Esta e a consequencia que torna a decisao REVERSIVEL."
      - "A citacao de fonte por registro (AC4) ja expoe o fabricante no memorial/UI — nao ha vinculo oculto."
      - "A UI nao pode exibir fabricante em rotulo fixo (sem hardcode 'Prysmian'); o fabricante vem do registro resolvido."
      - "Nenhuma analogia entre fabricantes e permitida, nunca (parecer §8) — nem como fallback, nem como aproximacao."
    backlog_item: "Avaliacao de segunda fonte de fabricante — registrado; NAO e bloqueio desta rodada."
    rationale: "Rastreavel ao parecer §2 [F4] e §5.1, que adotam Prysmian Rev. 10 como fonte primaria operacional."

