principio_de_produto:
  id: PP-1
  declaracao: >-
    Uma dependencia que ainda nao teve o calculo NBR executado (sem `resultado`, tipicamente em
    estado RASCUNHO) NAO perde as cargas adicionais ja cadastradas pelo projetista: essas cargas
    continuam derivando circuitos ADD-* normalmente. Apenas os circuitos que dependem do motor NBR
    — ILUM-* e TUG-*, calculados a partir de area/perimetro — deixam de ser emitidos, por nao
    terem base de calculo.
  natureza: >-
    Declaracao de requisito PROSPECTIVA, feita agora pelo dono do produto sobre um comportamento
    observado. NAO e reconstrucao retroativa de intencao: a motivacao historica do autor da
    mudanca nao commitada permanece desconhecida e nenhuma investigacao a localizou.
  justificativa_artigo_iv: >-
    O Artigo IV proibe INVENTAR motivacao ou fatos sem fonte; nao proibe o dono do produto de
    DECLARAR um requisito. A fonte primaria de PP-1 e a autorizacao explicita do usuario em
    2026-07-28, registrada em dois artefatos versionados (BLK-DERIVAR-CIRCUITOS-01 ->
    resolucoes_possiveis.R2 + decisao; DERIVAR-CIRCUITOS-1-sm-to-po.yaml -> decisao_do_usuario).
  fontes:
    - tipo: "Fonte primaria (o requisito)"
      referencia: "Decisao explicita do dono do produto (usuario), 2026-07-28"
    - tipo: "Observacao verificada"
      referencia: >-
        npx vitest run tests/domain/calculo/derivar-circuitos.test.ts (2026-07-28):
        2 circuitos ADD-*, nenhum ILUM-*/TUG-*
    - tipo: "Corroboracao arquitetural"
      referencia: "src/domain/calculo/cargas-adicionais.ts — VA de carga adicional sempre derivou de entrada, nunca de resultado"
    - tipo: "Corroboracao de produto"
      referencia: >-
        HANDOFF-CORRECAO-CIRCUITOS-TENSAO-INCOMPATIVEL-to-DEV.md (8o criterio) e
        ANALISE-PLANEJADOR-DE-CIRCUITOS.md §4.3 — escopos vizinhos, nao sobrepostos
  efeito_no_processo: >-
    Os 4 ACs da story rastreiam para PP-1 (requisito da propria story), e nao mais para uma
    motivacao a ser descoberta pelo @dev. A Task 5 foi REBAIXADA de mecanismo de conformidade
    para registro complementar.

