qa_must_know:
  - id: "QA-01"
    topic: "Como validar o item 4 do Definition of Done"
    note: >-
      O DoD pede "git diff VAZIO" em contratos.ts / otimizar-condutor.schema.ts /
      servico-dimensionamento-condutores.ts. O schema esta realmente intocado, mas os outros dois
      aparecem como M no git status por trabalho NAO COMMITADO DE STORIES ANTERIORES (MOD-DC /
      AUTO-OTI) que ja existia no worktree sujo antes desta story. Validar por AUSENCIA DE HUNK
      nas linhas do contrato, nao por diff vazio do arquivo inteiro:
      `git diff -U0 -- src/domain/dimensionamento-condutores/contratos.ts` produz hunks apenas em
      @@ -174,0 +175 @@ e @@ -176,0 +178,2 @@, ambos dentro de ResultadoDimensionamento
      (ib_a / i2_a / fonte_i2). RetornoMODQT (50-56) nao tem hunk algum.
  - id: "QA-02"
    topic: "Divergencia esperada no CA-QT-19"
    note: >-
      O teste de nao-regressao PASSA mas REGISTRA 11 divergencias por desenho. Isso e o
      comportamento correto sob a clausula "Or" do AC17, nao uma falha tolerada. Se um dia a
      lista ficar vazia, o teste tambem falha (assercao (c)) — sinal de que alguem mexeu na
      tabela de impedancia.
  - id: "QA-03"
    topic: "Padrao de fases do endpoint diverge da letra da Task 2.3"
    note: >-
      A Task 2.3 sugeria trifasico como padrao; foi implementado MONOFASICO (fator 2). Razao
      registrada na decisao D-01: e o default do proprio documento-fonte (§20, num_fases=1), e o
      comportamento do mock substituido, e √3 produz queda ~13,4% MENOR — adota-lo cegamente
      poderia aprovar circuito monofasico nao conforme, violando fail-closed (plano §2.2) e o
      espirito de R-09. Nenhum AC exige trifasico como padrao do endpoint. Se @qa julgar que
      isso extrapola a autoridade de @dev, e correcao de uma linha em CONTEXTO_PADRAO_ENDPOINT.
  - id: "QA-04"
    topic: "AC18 (CA-QT-20) virou inspecao automatizada"
    note: >-
      A story previa grep manual. Foi implementado como teste executavel que le os proprios
      arquivos-fonte e exige a citacao "NBR 5410:2004, §6.2.7" + "CONFIRMADO" no bloco da
      declaracao, e ausencia de literal duplicado no motor. Evidencia mais forte que o grep.
  - id: "QA-05"
    topic: "Artigo IV — verificar que nada foi promovido"
    note: >-
      Toda a TABELA_IMPEDANCIA tem status_verificacao "[VERIFICAR]" (teste explicito varre a
      tabela inteira). VER-QT-02, VER-QT-03, VER-QT-04 e VER-QT-07 continuam abertos. Aluminio
      degrada com alerta em vez de receber X inventado. Bifasico usa fator 2 com alerta.
  - id: "QA-07"
    topic: "Achado PRE-EXISTENTE fora do escopo desta story"
    note: >-
      tests/domain/calculo/derivar-circuitos.test.ts esta VAZIO (0 linhas; git diff mostra 281
      deletions). O reporter JSON do Vitest marca o arquivo como suite falha ("No test suite
      found in file"), embora vitest run saia com exit 0 e nenhum teste falhe. Esta story NAO
      tocou esse arquivo nem nada em tests/domain/calculo/ — o esvaziamento veio do mesmo
      trabalho nao commitado de sessao anterior que deixou o worktree sujo (ver QA-01).
      Nao foi corrigido por estar fora do escopo. Provavel destino: git checkout do arquivo
      antes do commit, decisao de quem consolidar o worktree (@qa ou @devops).
  - id: "QA-06"
    topic: "Ordem sugerida de revisao"
    note: >-
      1) ca-qt-19-nao-regressao.test.ts (gate zero e o ponto de maior risco);
      2) diff de modulos.mod-qt.validar.ts (mock fora de producao, contrato intacto);
      3) normativa/limites.ts e normativa/tabela-impedancia.ts (Artigo IV);
      4) motor-queda-tensao.ts (§18-§20);
      5) cobertura dos 16 ACs.

