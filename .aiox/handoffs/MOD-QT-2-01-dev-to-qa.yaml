ca_qt_19_nao_regressao:
  ordem: "PRIMEIRO teste escrito e executado, antes de qualquer outro do motor (Task 3 / §33 passo 3)"
  resultado: PASS
  divergencia_encontrada: true
  divergencia_casos: "11 de 504 combinacoes varridas"
  faixa_afetada: "3,10% < ΔV_mock <= 3,94%"
  causa_normativa: >-
    Mock usa resistividade generica ρ=0,0172 Ω·mm²/m a ~20°C; motor usa R tabelada por secao
    a temperatura de servico (70°C PVC — §13.3 CONFIRMADO, §13.4 provisoria). Razao
    R(70°C)/(ρ·1000/S) fica entre 1,262 e 1,290 em toda a faixa 1,5–25 mm². Divergencia
    CONSERVADORA: o motor nunca aprova o que o mock reprovava. E a "melhoria esperada e
    documentada" prevista na nota final do §13.4.
  tratamento: >-
    Aplicada a clausula "Or" do AC17. O teste caracteriza a divergencia em vez de mascara-la:
    (a) banda segura — toda entrada com ΔV_mock <= 3,10% aprovada SEM EXCECAO; (b) toda
    divergencia tem razao motor/mock dentro de [1,25; 1,30], provando causa unica — qualquer
    divergencia fora dessa faixa REPROVA o teste; (c) lista de divergencias nao pode ser vazia,
    o efeito fica registrado e nao suprimido.
  r09_respeitado: true
  valores_ajustados_para_forcar_aprovacao: "NENHUM"
  impacto_operacional: >-
    Circuitos hoje aprovados no C5 com ΔV entre ~3,1% e 4,0% (pela conta do mock) podem passar
    a reprovar. Nao e bug: e o calculo passando a considerar a temperatura de servico.
    secao_requerida_mm2 devolve a secao corretiva e o laco C1/C2/C6 do MOD-DC ja sabe consumi-la.

