ressalvas:
  - id: DC1-001
    severity: medium
    category: tests
    atribuivel_a_esta_story: false
    dominio: "queda-tensao / MOD-QT-2"
    bloqueia_story: false
    bloqueia_commit_push: true
    finding: >-
      `npx vitest run` não fecha em 0 arquivos falhando: 1 failed | 128 passed (129).
      A falha é TIMEOUT ("Error: Test timed out in 5000ms") em
      tests/domain/queda-tensao/catalogo-impedancia-completude.test.ts > AC3 (parecer §3.1) >
      "todos os campos exigidos estão presentes e preenchidos em cada um dos 1.563 registros",
      NÃO asserção. O mesmo arquivo passa 28/28 em 7,22s quando executado isolado.
    suggested_owner: "@dev do ciclo MOD-QT-2 / @po"
    suggested_action: >-
      Elevar o testTimeout desse `it` (ou movê-lo para fora do laço de 1.563 registros x N campos)
      para que ele deixe de ser flaky sob carga paralela.
  - id: DC1-002
    severity: low
    category: tests
    atribuivel_a_esta_story: false
    bloqueia_story: false
    bloqueia_commit_push: false
    finding: >-
      Débito conhecido, explicitamente fora de escopo por decisão do @po: não há cobertura de
      integração para o cenário de dependência em RASCUNHO nas telas de Correntes e Divisor de
      Circuitos. PP-1 hoje está protegido apenas na camada unitária de `derivarCircuitos`.
    suggested_owner: "@po (priorização de backlog)"
  - id: DC1-003
    severity: low
    category: code
    atribuivel_a_esta_story: false
    bloqueia_story: false
    bloqueia_commit_push: false
    finding: >-
      `npx eslint .` (projeto inteiro) permanece NÃO VERIFICADO por trava de 25+ min, e o lint
      escopado é 100% ruído de CRLF (core.autocrlf=true). Reincidente — mesma constatação do
      gate MOD-QT-2-02.
    suggested_owner: "@devops"
    suggested_action: >-
      Adicionar `.gitattributes` com `* text=auto eol=lf` (ou endOfLine: "auto" no Prettier) e
      investigar a lentidão do eslint de projeto inteiro.

