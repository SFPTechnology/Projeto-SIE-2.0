summary:
  objective: "Corrigir autopreenchimento de S (mm2) no MOD-QT a partir da seção persistida do MOD-DC."
  root_cause: >-
    A implementação anterior salvava cada circuito em paralelo no repositório
    `dimensionamento_condutores_resultado`. Como o Supabase usa um único JSONB
    por projeto (`secoes`), cada chamada fazia read+merge+upsert com mapa parcial,
    permitindo lost update por concorrência.
  implemented:
    - "Adicionado `salvarMuitos(projetoId, secoes, em)` nos repositórios memory e Supabase."
    - "`persistirResultadosMODDC()` agora consolida todos os circuitos com `secao_fase_mm2` e salva uma única vez."
    - "Se a tabela Supabase ainda não existir, o repositório Supabase usa fallback volátil de sessão para salvar/ler as seções reais recém-calculadas pelo MOD-DC."
    - "Adicionado teste de regressão do fluxo real MOD-DC -> MOD-QT sem redigitação manual."
    - "Reforçado teste AC1 para garantir que todos os circuitos com seção calculada aparecem no mapa persistido."

