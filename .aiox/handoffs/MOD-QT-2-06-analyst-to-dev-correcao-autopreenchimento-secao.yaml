  - "Nao alterar formulas dos motores de dimensionamento ou queda de tensao."
  - "Nao quebrar RetornoMODQT, ValidarMODQTSchema, RetornoMODQTSchema nem POST /api/v1/modulos/mod-qt/validar."
  - "Nao criar edicao silenciosa da coluna S."
  - "Preservar mudancas nao relacionadas no worktree."
  - "Nao executar git push, PR, tag ou release; exclusivo de @devops."

