divergencias_encontradas:
  - id: "PO-DIV-01"
    severidade: MEDIA
    campo_no_handoff_dev: "gates_tecnicos.test: PASS # 793 testes / 793 passando / 0 falhando / 336 arquivos"
    observado_pelo_po: "Test Files: 1 failed | 122 passed (123). Tests: 793 passed (793)."
    analise: >-
      Os 793 testes individuais realmente passam — essa parte do registro do @dev esta correta.
      Mas 'npm test' NAO fecha limpo: 1 arquivo de teste falha na coleta
      (tests/domain/calculo/derivar-circuitos.test.ts — "No test suite found in file").
      O handoff afirma "0 falhando", o que e verdadeiro na dimensao de testes e
      falso na dimensao de arquivos. Tambem ha divergencia de contagem de arquivos
      (handoff diz 336, execucao mostra 123) — provavelmente contagem de outra coisa.
    acao_para_qa: >-
      Nao aceitar "test: PASS" sem qualificar. Decidir se 1 test file failed e
      CONCERNS ou FAIL segundo o criterio do gate de QA.

  - id: "PO-DIV-02"
    severidade: ALTA
    achado: >-
      tests/domain/calculo/derivar-circuitos.test.ts esta com 0 linhas na worktree.
      No HEAD tinha 281 linhas. O diff e '281 deletions(-)', nao commitado.
      Ou seja: 281 linhas de cobertura de teste de derivar-circuitos foram
      esvaziadas e nao estao rodando.
    atribuicao: >-
      NAO atribuivel ao MOD-QT-2 pelo conteudo (dominio calculo/derivar-circuitos,
      sem relacao com queda-tensao), mas esta na mesma worktree suja que sera
      commitada junto. Provavelmente residual de MOD-CC/AUTO-OTI nao commitado.
    risco: >-
      Regressao de cobertura silenciosa. Se essa worktree for commitada como esta,
      281 linhas de teste desaparecem do repositorio sem registro em nenhuma story.
    acao_para_qa: >-
      Escalar antes de qualquer PASS. Ou o arquivo e restaurado (git checkout HEAD --
      tests/domain/calculo/derivar-circuitos.test.ts), ou a delecao precisa de
      justificativa escrita em alguma story. Nao e decisao do @po nem do @qa
      apagar cobertura sem rastro.

