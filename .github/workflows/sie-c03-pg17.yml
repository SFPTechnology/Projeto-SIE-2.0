name: "SIE C03 PostgreSQL 17 disposable schema"
on:
  push:
    branches:
      - feat/v201-bloco-c-dominio-eletrico
  pull_request:
    paths:
      - "docs/implantacao-sie-2-0/GREENFIELD/C03_SCHEMA_CANDIDATE_V201.sql"
      - "restructuring/supabase/migrations/20261028203000_sie_c03_electrical_domain_v201.sql"
      - "restructuring/supabase/greenfield/manifest.json"
      - "restructuring/supabase/greenfield/tests/c03_pg17.sql"
      - ".github/workflows/sie-c03-pg17.yml"
permissions:
  contents: read
jobs:
  schema-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: sie2_gf02_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sie2_gf02_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres_ci_only
      PGDATABASE: sie2_gf02_ci
      SIE_PG17_DISPOSABLE_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prove disposable only
        run: |
          test "$PGHOST" = "localhost"
          test "$PGDATABASE" = "sie2_gf02_ci"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${DATABASE_URL:-}"
          psql -X -v ON_ERROR_STOP=1 -At -c "SELECT current_database()"
      - name: Apply GF02+A03+A04 disposable harness
        run: psql -X -v ON_ERROR_STOP=1 -f restructuring/supabase/greenfield/tests/a03_a04_pg17.sql
      - name: Apply B04 candidate in disposable DB
        run: psql -X -v ON_ERROR_STOP=1 -f restructuring/supabase/migrations/20261028153000_sie_b04_idempotency_backend_grants_v201.sql
      - name: Apply C03 candidate only in disposable DB
        run: |
          cmp -s restructuring/supabase/migrations/20261028203000_sie_c03_electrical_domain_v201.sql docs/implantacao-sie-2-0/GREENFIELD/C03_SCHEMA_CANDIDATE_V201.sql
          python restructuring/supabase/greenfield/check_catalog.py --json
          psql -X -v ON_ERROR_STOP=1 -f restructuring/supabase/migrations/20261028203000_sie_c03_electrical_domain_v201.sql
      - name: Exercise electrical relation and security constraints
        run: psql -X -v ON_ERROR_STOP=1 -f restructuring/supabase/greenfield/tests/c03_pg17.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test tooling
        run: python -m pip install --disable-pip-version-check -e "./restructuring/apps/api[test]" "psycopg[binary]>=3.2,<4"
      - name: Register disposable migration history for B04 adapter guard
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA supabase_migrations;
          CREATE TABLE supabase_migrations.schema_migrations(version text PRIMARY KEY);
          INSERT INTO supabase_migrations.schema_migrations(version) VALUES
          ('20261027195557'),('20261028102000'),
          ('20261028102100'),('20261028153000'),('20261028203000');
          SQL
      - name: Exercise C05 calculation against sealed PostgreSQL snapshot
        working-directory: restructuring/apps/api
        run: python -m pytest tests/test_c05_pg17_bridge_v201.py -q
      - name: Rehearse the five legacy project shapes with synthetic PG17 records only
        working-directory: restructuring/apps/api
        run: python -m pytest tests/test_c08_disposable_five_projects_v201.py -q
      - name: Verify PostgreSQL 17 backup and clean restore in disposable database
        run: |
          set -euo pipefail
          test "$PGDATABASE" = "sie2_gf02_ci"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          cid="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$cid"
          docker exec "$cid" pg_dump -U postgres -d sie2_gf02_ci -Fc -f /tmp/sie2-c-disposable-backup.dump
          docker exec "$cid" pg_restore --list /tmp/sie2-c-disposable-backup.dump >/dev/null
          docker exec "$cid" createdb -U postgres sie2_c_restore_check
          docker exec "$cid" pg_restore -U postgres -d sie2_c_restore_check --exit-on-error --no-owner --no-acl /tmp/sie2-c-disposable-backup.dump
          for db in sie2_gf02_ci sie2_c_restore_check; do
            docker exec "$cid" psql -X -U postgres -d "$db" -v ON_ERROR_STOP=1 -At -c \
              "SELECT 'fingerprint=' || md5(concat_ws('|',
                (SELECT string_agg(md5(row_to_json(p)::text),',' ORDER BY p.id) FROM public.sie_projects p),
                (SELECT string_agg(md5(row_to_json(r)::text),',' ORDER BY r.id) FROM public.sie_project_revisions r),
                (SELECT string_agg(md5(row_to_json(c)::text),',' ORDER BY c.id) FROM public.sie_circuits c),
                (SELECT string_agg(md5(row_to_json(l)::text),',' ORDER BY l.id) FROM public.sie_loads l),
                (SELECT string_agg(md5(row_to_json(q)::text),',' ORDER BY q.id) FROM public.sie_rooms q)
              ));" > "/tmp/$db.fingerprint"
          done
          cmp /tmp/sie2_gf02_ci.fingerprint /tmp/sie2_c_restore_check.fingerprint
          test "$(docker exec "$cid" psql -X -U postgres -d sie2_c_restore_check -At -c \
            "SELECT count(*) FROM public.sie_project_revisions WHERE sealed_snapshot_sha256 IS NOT NULL;")" -ge 1
          echo 'PASS: isolated PG17 backup/restore matches project, revision, circuit, load and room data fingerprints'
          docker exec "$cid" rm -f /tmp/sie2-c-disposable-backup.dump
      - name: Verify no remote endpoint
        run: |
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          echo "PASS: C03 only ephemeral local PG17"
