name: SIE Browser E2E (Chromium)

on:
  push:
    paths:
      - 'docs/stories/SIE-F10.md'
      - 'docs/implantacao-sie-2-0/F10/**'
      - 'docs/stories/story-SIE-F11-QA-INTEGRADO.md'
      - 'docs/implantacao-sie-2-0/F11/**'
      - 'restructuring/**'
      - '.github/workflows/sie-e2e-browser.yml'
  pull_request:
    paths:
      - 'docs/stories/SIE-F10.md'
      - 'docs/implantacao-sie-2-0/F10/**'
      - 'docs/stories/story-SIE-F11-QA-INTEGRADO.md'
      - 'docs/implantacao-sie-2-0/F11/**'
      - 'restructuring/**'
      - '.github/workflows/sie-e2e-browser.yml'

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and isolated E2E test tools
        working-directory: restructuring/apps/api
        run: python -m pip install -e ".[test,e2e]"
      - name: Record F11 browser test environment
        run: |
          mkdir -p run-artifacts
          python --version > run-artifacts/f11-browser-environment.txt
          python -m pip freeze >> run-artifacts/f11-browser-environment.txt
      - name: Archive F11 browser test environment
        uses: actions/upload-artifact@v4
        with:
          name: f11-browser-environment-${{ github.run_id }}
          path: run-artifacts/f11-browser-environment.txt
          if-no-files-found: error
          retention-days: 14
      - name: Install Chromium for browser testing
        run: python -m playwright install --with-deps chromium
      - name: Exercise real browser against localhost API, UI and SQLite
        env:
          CI: 'true'
        run: python -m pytest -q restructuring/e2e

      - name: Archive F01 mobile visual checks without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f01-mobile-visual-${{ github.run_id }}
          path: run-artifacts/f01-mobile-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Archive F10 visual checks without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f10-visual-${{ github.run_id }}
          path: run-artifacts/f10-*
          if-no-files-found: warn
          retention-days: 7
