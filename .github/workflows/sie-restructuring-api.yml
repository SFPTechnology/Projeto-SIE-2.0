name: SIE modular API
on:
  push:
    paths:
      - 'docs/stories/SIE-F10.md'
      - 'docs/implantacao-sie-2-0/F10/**'
      - 'docs/stories/story-SIE-F11-QA-INTEGRADO.md'
      - 'docs/implantacao-sie-2-0/F11/**'
      - 'restructuring/**'
      - 'docs/stories/story-SIE-B-V201-AUTH-API.md'
      - 'docs/implantacao-sie-2-0/GREENFIELD/B*.md'
      - '.github/workflows/sie-restructuring-api.yml'
      - '.github/workflows/sie-e2e-browser.yml'
      - '.github/workflows/sie-orchestrator-quality.yml'
      - 'scripts/f00_golden.py'
      - 'docs/sie-orchestrator/ORCHESTRATOR_STATE.json'
      - 'docs/implantacao-sie-2-0/F01/QA3_MANIFEST.json'
      - '.github/agents/f01-qa-*.agent.md'
      - '.github/skills/f01-*/SKILL.md'
      - 'scripts/f01_release_gate.py'
      - 'scripts/f01_cell_evidence_gate.py'
      - 'scripts/f01_qa_workflow_audit.py'
      - 'scripts/f01_inventory_audit.py'
      - 'scripts/f01_gate_dashboard.py'
      - 'scripts/f01_qa3_evidence_bundle.py'
      - 'scripts/f01_copilot_reports_gate.py'
      - '.github/workflows/f01-copilot-qa-isolated.yml'
      - 'docs/implantacao-sie-2-0/F01/INVENTARIO_CELULAS_E_REGRAS_USADAS.csv'
      - 'docs/implantacao-sie-2-0/F01/MATRIZ_CELULAS_NORMATIVAS_F01.json'
      - 'docs/implantacao-sie-2-0/F01/PLANO_YOLO_DESBLOQUEIO_F01_V2.md'
      - 'scripts/f01_yolo_runner.py'
      - 'docs/stories/story-SIE-AUTO-011-DEPENDENCY-SCHEDULER.md'
      - '.github/workflows/sie-restructuring-api.yml'
  pull_request:
    paths:
      - 'docs/stories/SIE-F10.md'
      - 'docs/implantacao-sie-2-0/F10/**'
      - 'docs/stories/story-SIE-F11-QA-INTEGRADO.md'
      - 'docs/implantacao-sie-2-0/F11/**'
      - 'restructuring/**'
      - 'scripts/f00_golden.py'
      - '.github/workflows/sie-restructuring-api.yml'
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
        working-directory: restructuring/apps/api
      - name: Record F11 Python environment
        run: |
          mkdir -p run-artifacts
          python --version > run-artifacts/f11-api-environment.txt
          python -m pip freeze >> run-artifacts/f11-api-environment.txt
      - name: Archive F11 Python environment
        uses: actions/upload-artifact@v4
        with:
          name: f11-api-environment-${{ github.run_id }}
          path: run-artifacts/f11-api-environment.txt
          if-no-files-found: error
          retention-days: 14
      - name: Check registered normative API routes
        run: python -c "from fastapi.testclient import TestClient; from sie_api.main import app; r=TestClient(app).get('/api/v1/normas/catalogo'); print(r.status_code, r.json()); assert r.status_code == 200"
        working-directory: restructuring/apps/api
      - name: Verify independent QA3 manifests cannot bypass F01 gate
        run: python scripts/f01_release_gate.py --verify-invariants
      - name: Check F01 YOLO planner dry-run and syntax (do not start agents)
        run: |
          python -m py_compile scripts/f01_yolo_runner.py
          python scripts/f01_yolo_runner.py
      - name: Validate normative cell registry schema without granting approval
        run: python scripts/f01_cell_evidence_gate.py
      - name: Verify QA3 evidence bundler syntax without any real agent
        run: python -m py_compile scripts/f01_qa3_evidence_bundle.py
      - name: Audit QA3 Copilot options, report creation, workspace isolation (no token used)
        run: python scripts/f01_qa_workflow_audit.py
      - name: Audit every legacy EDP category and generate pending source-cell work items
        run: |
          mkdir -p run-artifacts
          python scripts/f01_inventory_audit.py --write-pending run-artifacts/f01-cells-to-review.json
      - name: Publish machine-readable six-gate and ten-criteria status (no approval)
        run: |
          mkdir -p run-artifacts
          python scripts/f01_gate_dashboard.py > run-artifacts/f01-evidence-status.json
          cat run-artifacts/f01-evidence-status.json
      - name: Archive pending-source-cell candidates (not normative evidence)
        uses: actions/upload-artifact@v4
        with:
          name: f01-cells-to-review
          path: run-artifacts/f01-cells-to-review.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive F01 evidence-status dashboard
        uses: actions/upload-artifact@v4
        with:
          name: f01-evidence-status
          path: run-artifacts/f01-evidence-status.json
          if-no-files-found: error
          retention-days: 14
      - name: Run unit and API tests
        run: python -m pytest -q
        working-directory: restructuring/apps/api
      - name: Generate audited C11/C12 E01-E11 arithmetic and fail-closed evidence
        run: |
          mkdir -p run-artifacts
          python -m sie_api.v201_c_e01_e11_evidence --output run-artifacts/c-e01-e11-evidence.json
          python -m json.tool run-artifacts/c-e01-e11-evidence.json > /dev/null
      - name: Archive real E01-E11 execution evidence for professional review
        uses: actions/upload-artifact@v4
        with:
          name: c-e01-e11-evidence-${{ github.run_id }}
          path: run-artifacts/c-e01-e11-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Replay immutable F00 baseline without rewriting expectations
        run: python scripts/f00_golden.py --verify
      - name: Check frontend JavaScript syntax
        run: node --check restructuring/apps/web/app.js
      - name: Inventory checked-out source artifacts without approving normative values
        run: python -m sie_api.normative_inventory --root . --output run-artifacts/sie-normative-integrity.json --require-all
      - name: Upload source integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: sie-normative-integrity
          path: run-artifacts/sie-normative-integrity.json
          if-no-files-found: error
          retention-days: 7
