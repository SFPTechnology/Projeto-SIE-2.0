name: SIE restructuring API checks
on:
  push:
    paths:
      - 'restructuring/**'
  pull_request:
    paths:
      - 'restructuring/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
        working-directory: restructuring/apps/api
      - name: Test
        run: python -m pytest -q
        working-directory: restructuring/apps/api
