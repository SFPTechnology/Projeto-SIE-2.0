[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sie-api"
version = "0.1.0"
description = "Fundacao modular FastAPI para SIE 2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
e2e = ["playwright>=1.55,<2"]

[tool.setuptools.package-data]
"sie_api" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
