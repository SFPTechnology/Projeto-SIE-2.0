<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>SIE 2.0 | Recuperação de acesso DEV</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0a1221;color:#e8eefb}
body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center}
main{width:min(100%,460px);background:#111d32;padding:28px;border:1px solid #2f3e59;border-radius:16px}
label{display:block;margin:18px 0 6px}input{width:100%;padding:12px;box-sizing:border-box;border-radius:8px;background:#0a1221;color:#fff;border:1px solid #53647f}
button{margin-top:16px;padding:12px;background:#2454a2;color:white;border:0;border-radius:8px;cursor:pointer}
p{line-height:1.5;color:#b4c2d9}a{color:#97caff}h1{font-size:1.5rem}
</style>
</head>
<body>
<main>
<p>SIE 2.0 · Desenvolvimento</p>
<h1>Definir nova senha</h1>
<p>Somente para recuperação de uma sessão autorizada. Não libera o uso do software em produção.</p>
<form id="reset">
<label for="new-password">Nova senha</label>
<input id="new-password" autocomplete="new-password" type="password" minlength="12" required>
<button id="save" type="submit">Atualizar senha</button>
</form>
<p id="status" role="status" aria-live="polite">Verificando convite de recuperação…</p>
<a href="../../auth-v201.html">Voltar ao acesso DEV</a>
</main>
<script src="../../auth-v201.public-config.js"></script>
<script type="module" src="../../auth-v201-recovery.js"></script>
</body>
