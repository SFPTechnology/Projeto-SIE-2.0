      criados por esta story: `SeletorPerfilCabo.tsx` (57:36, 73:91, 95:27, 184:18) e
      `opcoes-perfil-cabo.ts` (160:39, 191:21). DoD item 7 ("npm run lint ... passando")
      não atendido.
    suggested_action: >-
      `npx eslint --fix src/components/app/queda-tensao/SeletorPerfilCabo.tsx
      src/domain/queda-tensao/normativa/opcoes-perfil-cabo.ts` e reexecutar sem `--fix`
      confirmando exit 0. Nenhuma alteração de lógica é necessária.

  - id: "DOC-001"
    severity: high
    finding: >-
      O Dev Agent Record (seção "Debug Log — gates executados") e o Change Log v1.0 desta
