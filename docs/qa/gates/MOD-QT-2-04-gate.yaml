# ---------------------------------------------------------------------------
# VERIFICAÇÕES OBRIGATÓRIAS E INDEPENDENTES
# ---------------------------------------------------------------------------
verificacoes_independentes:
  - id: V1
    item: "Contrato público por símbolo"
    resultado: PASS
    evidencia: >-
      `src/api/schemas/otimizar-condutor.schema.ts` ausente de `git status` (intocado);
      `RetornoMODQT` não aparece no diff de `dimensionamento-condutores/contratos.ts`
      (o diff toca só `ResultadoDimensionamento`, trabalho alheio);
      `createFileRoute("/api/v1/modulos/mod-qt/validar")` byte a byte idêntico. As
      alterações desta story no motor são internas a `construirFonte()`.

  - id: V7
    item: "AC9 — supressão de [VERIFICAR — alínea 6.2.7.1] exige o PAR (perfil resolvido ∧ limite coincidente)"
    resultado: PASS
    evidencia: >-
      Código lido em `motor-queda-tensao.ts` (`construirFonte`):
      `const alineaResolvida = perfilLimite !== null && perfilLimite.limite_total_pct ===
      interno.limite_total_pct;` — só então a marcação deixa de ser anexada; caso
      contrário o ramo `LIMITES_TOTAIS_SUJEITOS_A_ALINEA.includes(...)` a anexa. Além
      disso, na montagem do resultado (linha ~414) a divergência entre perfil declarado e
      limite recebido gera ALERTA explícito e NÃO ajusta o limite ("Nenhum limite foi
      ajustado automaticamente (Artigo IV)"). Testes cobrem os três casos: suprimida sob o
      perfil (motor-queda-tensao.test.ts:594), preservada fora dele (:607) e preservada em
      divergência (:613, :627). Os 2 testes de CA-QT-22 permanecem (describe :553).
      AVALIAÇÃO DO @qa: a decisão D-04-02 é correta e conservadora — confirma, não
      substitui. NÃO é fraca nem unilateral; não gera CONCERNS nem FAIL.

  - id: V-AC4-6
    item: "Perfil EDP-SP v09 — 5%/1%, sem fallback de 7%, sem reuso"
    resultado: PASS
    evidencia: >-
      `limites.ts`: `PERFIL_LIMITE_EDP_SP_V09_ID = "EDP_SP_PTDTPDN00068_V09_AEREA_BT"`,
      `limite_total_pct: 5`, `limite_conexao_medicao_pct: LIMITE_RAMAL_ENTRADA_EDP_PCT` (=1),
      `status_verificacao: "CONFIRMADO"`. `resolverPerfilLimiteAtendimento()` exige
      igualdade nos CINCO campos (distribuidora, padrao_tecnico, versao_padrao, rede,
      segmento_tensao) e devolve `null` em qualquer divergência — fail-closed, sem
      aproximação e sem fallback. `perfilLimitePorId()` idem. Cobertos por
      `limites-edp-sp-v09.test.ts` (14 testes, incluindo os negativos de reuso e de 7%).

  - id: V-AC1-3-8
    item: "Fluxo de entrada fechado e conduto ferromagnético como rejeição"
    resultado: PASS
    evidencia: >-
      `opcoes-perfil-cabo.ts` deriva as listas do catálogo a cada consulta
      (`metaisDisponiveis`, `temperaturasDisponiveis`, `secoesDisponiveis`,
      `topologiasDisponiveis`) e delega a decisão final a `tentarResolverPerfilImpedancia()`
      — RSK-B5 atendido, sem segunda fonte de verdade. `estaForaDoDominioCalculavel()` e
      `podeSubmeterAoMotor()` bloqueiam `METALICO_FECHADO_FERROMAGNETICO`. Nenhuma
      topologia do catálogo o representa (confirmado: 12 topologias, nenhuma ferromagnética).
      15 testes de domínio + 12 de UI.

  - id: V-INTEGRACAO-UI
    item: "SeletorPerfilCabo deixou de ser órfão"
    resultado: PASS
    evidencia: >-
      `src/routes/projetos.$projetoId_.queda-tensao.tsx`: import (linha 10), render
      (linha 119), seed a partir de `config.perfil_cabo` (linhas 178-182) e persistência
      via `perfilCaboParaPersistir()` (linhas 195, 211). Snapshot VRT regenerado
      coerentemente.

  - id: V9
    item: "MOD-DC intocado"
    resultado: PASS
    evidencia: >-
      `git diff src/domain/dimensionamento-condutores/` = 0 ocorrências de
      queda|perfil_cabo|impedanc|prysmian|retorno_qt|limite_total. As modificações
      presentes na worktree são de MOD-CC/AUTO-OTI/proteção, alheias a esta cadeia.

  - id: V10
    item: "BLK-QT-TIMEOUT-FLAKY-01"
    resultado: NAO_REPRODUZIDO
    evidencia: >-
      2 execuções completas consecutivas: 132/132 arquivos, 947/947 testes, exit 0.
      Blocker MANTIDO ABERTO com severidade rebaixada MÉDIA → BAIXA; causa estrutural
      inalterada. Não fechado sem evidência de correção.

  - id: V-LINT
    item: "Gate de lint escopado declarado no Dev Agent Record"
    resultado: FAIL_SUPERADO   # rodada 1; ver `re_gate_pos_fix.gates_reexecutados.lint_escopado` → PASS na rodada 2
    evidencia: >-
      `npx eslint src/components/app/queda-tensao/SeletorPerfilCabo.tsx
      src/domain/queda-tensao/normativa/opcoes-perfil-cabo.ts` → exit 1, 6 erros
      `prettier/prettier`. Arquivos com fim de linha LF (não é artefato de CRLF/autocrlf).
      O mesmo escopo restrito aos arquivos de MOD-QT-2-03 fecha em exit 0 — as 6 violações
      pertencem exclusivamente aos 2 arquivos criados por esta story. O Debug Log da story
      registra "Lint | npx eslint <arquivos tocados> | PASS após --fix (6 violações de
      prettier/prettier, apenas formatação)" — a contagem coincide, o resultado não.

