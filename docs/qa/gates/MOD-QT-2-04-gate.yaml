re_gate_pos_fix:
  escopo: >-
    Re-gate PONTUAL. As 9 verificações independentes da rodada 1 (contrato público por
    símbolo, fonte_id, AC9/D-04-02, perfil EDP-SP v09, fluxo fechado, integração de UI,
    MOD-DC intocado) NÃO foram reabertas: o fix desta rodada é exclusivamente de formatação
    e não tocou nenhuma delas. Reexecutados apenas os 3 gates técnicos + a delimitação do
    diff.

  delimitacao_do_diff:
    metodo: >-
      `git diff --stat` não é conclusivo isoladamente: os 2 arquivos de produção desta story
      são NOVOS (untracked) e a worktree do submódulo está suja com trabalho alheio
      pré-existente (MOD-CC/AUTO-OTI/proteção). A delimitação foi feita por mtime contra o
      instante do gate anterior.
    comando: 'find src -type f -newermt "2026-07-29 06:30"'
    resultado: PASS
    evidencia: >-
      Exatamente 2 arquivos em `src/**` alterados desde o gate anterior:
      `src/components/app/queda-tensao/SeletorPerfilCabo.tsx` e
      `src/domain/queda-tensao/normativa/opcoes-perfil-cabo.ts`. Nenhum outro arquivo de
      código, teste, contrato, snapshot ou config foi tocado. No repositório raiz, o único
      arquivo alterado em `docs/stories`, `docs/qa`, `.aiox/workflow-state` e
      `.aiox/handoffs` foi a própria story MOD-QT-2-04. Confirmado: MOD-QT-2-03 e
      DERIVAR-CIRCUITOS-1 intocados.

  gates_reexecutados:
    lint_escopado:
      comando: "npx eslint src/components/app/queda-tensao/SeletorPerfilCabo.tsx src/domain/queda-tensao/normativa/opcoes-perfil-cabo.ts"
      observacao: "SEM --fix, executado pelo @qa, não aceito por alegação do @dev"
      resultado: PASS
      detalhe: "exit 0 — nenhuma saída, 0 erros, 0 warnings. As 6 violações prettier/prettier (57:36, 73:91, 95:27, 184:18 / 160:39, 191:21) não existem mais no disco."
    typecheck:
      comando: "npx tsc --noEmit"
      resultado: PASS
      detalhe: "exit 0, sem saída"
    test_run_3:
      comando: "npx vitest run"
      observacao: "sem --reporter=basic (mascara falha de startup com exit 0 no Vitest 4)"
      resultado: PASS
      detalhe: "Test Files 132 passed (132) | Tests 947 passed (947) | exit 0 | 261,49 s — baseline preservado, zero regressão"
    lint_projeto_inteiro:
      comando: "npx eslint ."
      resultado: NAO_VERIFICADO
      detalhe: "trava ambiental pré-existente; NÃO presumido PASS — é a única razão do CONCERNS"

  achados_fechados:
    - id: MNT-001
      status: RESOLVIDO
      evidencia: "eslint escopado exit 0 verificado pelo @qa em reexecução independente"
    - id: DOC-001
      status: RESOLVIDO
      evidencia: >-
        O @dev retificou a linha do Debug Log e do Change Log v1.0 EM VEZ DE REMOVÊ-LAS,
        preservando o rastro do erro, e colou a saída real (comando + exit code) de cada
        gate. A causa declarada (o `--fix` não persistiu antes da interrupção da sessão) é
        consistente com o observado. Integridade de evidência restabelecida.

