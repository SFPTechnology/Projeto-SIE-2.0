nfr_validation:
  security:
    status: CONCERNS
    notes: >-
      Todos os 6 endpoints validam entrada com Zod via `withZod` antes de qualquer uso; sem SQL
      dinâmico, sem eval, sem segredo hardcoded. `secao_mm2` restrita à série IEC 60228 no
      schema (D-05) impede gravação de seção fora de norma — boa prática de validação positiva.
      Uma ressalva nova: QT202-002 (cast de `parametros` sem schema).
      Duas características PRÉ-EXISTENTES do projeto, não introduzidas por esta story e por
      isso não penalizadas: (1) nenhuma rota de /api/v1 tem authn/authz — verificado, 0
      ocorrências de authorization/getUser/session em todo o diretório; (2) `autor` é fornecido
      pelo cliente e cai em "sistema" quando ausente, padrão presente em 13 rotas anteriores.
      Consequência a registrar: sem authn, a trilha de auditoria R-11 é atribuível apenas por
      convenção, não por identidade verificada.
  performance:
    status: PASS
    notes: >-
      Endpoints delegam a motor stateless. `SimularQuedaSchema` limita cenários a `.max(20)`,
      impedindo amplificação de custo por request — mitigação de DoS simples, bem posta.
      Build 8.50s; chunk da rota UI em 37 kB (gzip 7,86 kB), proporcional.
  reliability:
    status: PASS
    notes: >-
      D-04 fail-closed verificado: sem comprimento ou sem seção → PENDENTE sem cálculo (R-08);
      tensão ausente → padrão 220 V COM alerta explícito exibido na UI (R-03), degradação
      sinalizada e nunca silenciosa. Repositório Supabase degrada graciosamente sem a tabela.
      `mapearErro` cobre os três erros de domínio novos (404/422/400).
  maintainability:
    status: PASS
    notes: >-
      RSK-9 respeitado com rigor: zero linha de fórmula na story; `SERIE_IEC_60228` e
      `LIMITES_TOTAIS_SUJEITOS_A_ALINEA` importados do domínio em vez de redigitados nos
      schemas — exatamente o padrão que evita divergência normativa entre camadas.
      D-08 (extração de helpers para .ts) eliminou os avisos react-refresh, confirmado pelo
      lint escopado limpo.

