# Decisão sobre PT-11 / D-02 — delegada explicitamente a @qa pelo @dev
# ---------------------------------------------------------------------------
decisao_d02_grafico:
  pendencia: PT-11
  questao: "Gráfico em SVG puro com tokens Carbon em vez de @carbon/charts-react (Task 4.1)"
  decisao: ACEITO_COMO_IMPLEMENTACAO_EQUIVALENTE
  justificativa: >-
    (a) O requisito funcional da AC3/CA-QT-14 é "linhas de limite aparecem em 4% (circuito) e no
    limite total". Ele está atendido e testado — dois `data-testid` distintos, dois rótulos, e a
    variante que troca 7%→5% e verifica que o gráfico acompanha.
    (b) O argumento de testabilidade é tecnicamente correto e decisivo: @carbon/charts-react é
    baseado em d3 e monta no DOM via useEffect; sob `renderToStaticMarkup` — único mecanismo de
    evidência visual existente neste repositório, sem jsdom nem playwright — o SSR produziria
    contêiner vazio, tornando a evidência exigida pela AC3 IMPOSSÍVEL de produzir. A biblioteca
    literal comprometeria o próprio critério que ela deveria satisfazer.
    (c) @carbon/charts-react não é dependência do projeto; adicionar d3 ao bundle SPA estático
    perto de RSK-8 é risco de build sem contrapartida.
    (d) O teste assere `resultado.limite_circuito_pct === 4`, provando que o 4,0% exibido vem do
    motor (§13.1) e não de um literal da UI — exatamente a garantia que importa em AC3.
  ressalva: >-
    A decisão vale para o escopo atual. Se o projeto adotar @carbon/charts-react e
    infraestrutura de browser (jsdom/playwright) no futuro, o componente deve ser reavaliado
    para alinhamento com o design system — registrado em recommendations.future.
  desvio_de_texto_literal_da_task: "Reconhecido e aceito. Não é violação do Artigo IV: nenhum valor normativo foi inventado."

