top_issues:
  - id: QT202-001
    severity: high
    category: tests
    finding: "Mesmo QT201-001 — `npm test` exit 1 por regressão em src/domain/calculo/derivar-circuitos.ts."
    atribuivel_a_esta_story: false
    suggested_owner: po
    bloqueia_story: false
    bloqueia_commit_push: true

  - id: QT202-002
    severity: medium
    category: security
    finding: >-
      Em `projetos.$projetoId.circuitos.$circuitoId.aplicar-cenario.ts:37`, `parametros` é
      declarado no schema como `z.record(z.string(), z.unknown())` e depois forçado com
      `as unknown as ParametrosDimensionamento` antes de alimentar `dimensionarCircuito`.
      Entrada controlada pelo cliente atravessa a fronteira de validação sem schema real
      (OWASP A03 — Injection/Improper Input Validation, variante de mass assignment).
      É o ÚNICO ponto do projeto com esse cast (`grep` em src/routes/api/v1/ retorna 1 ocorrência).
    atribuivel_a_esta_story: true
    suggested_owner: dev
    impacto_avaliado: >-
      Contido: `parametros` alimenta cálculo determinístico, não query nem filesystem nem
      shell. Pior caso realista é resultado de dimensionamento inválido ou exceção — capturada
      por `mapearErro`. Não é escalada de privilégio nem vazamento. Por isso MEDIUM e não HIGH.
    recomendacao: >-
      Substituir por um schema Zod explícito de ParametrosDimensionamento (ou reusar o já
      existente no domínio de dimensionamento-condutores) e remover o cast duplo.

  - id: QT202-003
    severity: low
    category: docs
    finding: >-
      A seção "Gates técnicos" da story declara "815 testes PASS, 124 arquivos" e atribui a
      falha a "arquivo com 0 bytes". Ambos desatualizados: hoje são 833 testes / 126 arquivos e
      a falha é de assertiva, com o arquivo restaurado em 281 linhas.
    atribuivel_a_esta_story: true
    suggested_owner: dev
    recomendacao: "Reexecutar e registrar exit code + linha-resumo literal ao fechar a story."

  - id: QT202-004
    severity: low
    category: code
    finding: >-
      PT-08: a tabela `queda_tensao_config` não existe no Supabase. A configuração do
      alimentador/comprimentos não persiste entre sessões.
    atribuivel_a_esta_story: true
    suggested_owner: dev
    impacto_avaliado: >-
      Baixo e consciente: o repo degrada graciosamente (mesmo padrão de
      dimensionamento_condutores_overrides) e a tela não quebra. Decisão D-01 alinhada com o
      escopo declarado da story ("PT-07 cobre apenas leitura/gravação exigida pelos 5
      endpoints, não uma migração de schema mais ampla").
    recomendacao: "Criar a tabela + policy anon — @data-engineer (PT-08)."

