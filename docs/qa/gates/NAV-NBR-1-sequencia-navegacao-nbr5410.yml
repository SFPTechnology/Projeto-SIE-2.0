  - id: "QA-NAV-002"
    severity: medium
    category: process
    finding: >-
      Nenhuma revisão automática de código cobriu este diff. O binário do CodeRabbit existe
      em /root/.local/bin/coderabbit mas aborta com "Illegal instruction (core dumped)" em
      qualquer invocação — mesmo blocker de SIE-DS-00, SIE-DS-07, SIE-DS-09 e T2-SEM-MOTOR-1.
      O dev declarou a indisponibilidade explicitamente em vez de reportar revisão limpa,
      que é o comportamento correto. O risco residual é baixo dado o tamanho e a natureza do
      diff (reordenação de array e comentários, sem lógica), mas é real e recorrente.
    suggested_owner: devops
    suggested_action: >-
      Tratar a recuperação do CodeRabbit como item de infraestrutura próprio. Quatro stories
      seguidas fecharam sem revisão automática; isso deixou de ser exceção.
    refs:
      - "docs/stories/story-NAV-NBR-1-sequencia-navegacao-nbr5410.md#dev-agent-record"

  - id: "QA-NAV-003"
    severity: low
    category: consistency
    finding: >-
      Divergência remanescente entre as duas superfícies de navegação: o Command Center põe
      o grupo "entrada" antes de "dimensionamento" (o menu lateral põe depois) e seu grupo
      de dimensionamento não contém dimensionamento-disjuntores. A decisão do dev de não
      tocar module-navigation-data.ts está correta — as duas contradições que esta story
      corrige já estavam ausentes daquela superfície, e alinhar só a posição do grupo sem
      resolver a ausência do item produziria coerência aparente.
    suggested_owner: po
    suggested_action: >-
      Avaliar a completude de ModuleNavigation no épico do Command Center, junto com o
      Achado 4 da auditoria (reposicionamento do Command Center).
    refs:
      - "src/components/command-center/module-navigation-data.ts"

