notes: >-
  Verificações independentes executadas por QA: forma final de NAV_GROUPS extraída do
  arquivo; ordem dos itens do grupo de cálculo conferida por número de linha; campos
  label/hint/icon/to/requiresProjeto dos itens movidos conferidos byte-a-byte; tipos
  RotaProjeto e RotaGlobal conferidos como intocados; ausência de sie-shell/nav-model em
  todos os manifestos de tutorial conferida por grep. As mutações A e B foram observadas
  ao vivo durante a execução do workflow, com restauração verificada por hash e diff.

  Observação de método registrada pelo dev e aceita: o baseline de testes foi disparado
  antes das edições mas provavelmente transformou o arquivo de teste já editado, então seu
  total não serve como contagem pré-mudança. Isso não afeta o veredito — o estado final é
  medido diretamente e não há falha alguma nele. A falha transitória em
  catalogo-impedancia-completude (5156 ms contra timeout padrão de 5000 ms) foi
  corretamente diagnosticada como contenção de recursos e refutada por execução isolada
  (28/28) e por re-execução limpa da suíte completa.

  AC14 foi deixado aberto pelo dev em vez de marcado como cumprido. A leitura está correta:
  ao pé da letra o AC exige seis gates em 0 e isso não ocorre. QA aceita a story assim
  mesmo porque a única falha é comprovadamente externa ao diff, e considera a recusa em
  marcar o checkbox um sinal positivo de disciplina de relato, não um defeito.
