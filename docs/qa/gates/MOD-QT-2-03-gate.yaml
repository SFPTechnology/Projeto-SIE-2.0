top_issues:
  - id: "TEST-001"
    severity: low
    finding: >-
      O gate AC10 do CA-QT-19 verifica ausência de marcação com
      `publico.fonte.includes("[VERIFICAR]")`. Essa substring NÃO casa com
      `MARCACAO_VERIFICAR_ALINEA = "[VERIFICAR — alínea 6.2.7.1]"`. O guarda do parecer
      §6 C-07 ("não existir [VERIFICAR] em saída aprovada") é, portanto, mais estreito do
      que o texto do teste declara. Sem defeito hoje (a grade usa limite 4%, fora de
      LIMITES_TOTAIS_SUJEITOS_A_ALINEA = [5,7]), mas o guarda não detectaria a regressão
      que ele existe para impedir.
    suggested_action: >-
      Trocar por `expect(publico.fonte).not.toMatch(/\[VERIFICAR/)` ou verificar
      explicitamente `MARCACAO_VERIFICAR_ALINEA` além de "[VERIFICAR]".
    file: "tests/domain/queda-tensao/ca-qt-19-nao-regressao.test.ts:174"

  - id: "TEST-002"
    severity: low
    finding: >-
      O bloco declarado "DIAGNÓSTICO LEGADO (não é critério)" contém
      `expect(Math.min(...razoes)).toBeGreaterThan(1)`. A razão motor/mock segue capaz de
      reprovar a suíte, o que contraria a formulação do AC9 ("emitida apenas como
      diagnóstico"). O critério de CORREÇÃO permanece corretamente o oracle independente —
      por isso severidade baixa, não bloqueante.
    suggested_action: >-
      Converter o assert em registro (console/anexo de diagnóstico) ou renomear o teste
      para declarar que a DIREÇÃO da diferença de fonte (Rca a T de operação > ρ a 20 °C)
      é intencionalmente assertiva.
    file: "tests/domain/queda-tensao/ca-qt-19-nao-regressao.test.ts:240"

  - id: "OPS-001"
    severity: low
    finding: >-
      BLK-QT-TIMEOUT-FLAKY-01 não se reproduziu em 2 execuções completas consecutivas,
      mas a causa estrutural (1.563 × 13 asserts com callback de mensagem dentro do
      testTimeout padrão de 5 s) não foi alterada. O risco de suíte não determinística
      sob carga permanece latente.
    suggested_action: >-
      Adicionar `testTimeout` próprio ao `it` das linhas 156-172 ou reduzir o custo do
      laço (acumular divergências e assertar uma vez ao final).
    file: "tests/domain/queda-tensao/catalogo-impedancia-completude.test.ts:156"

