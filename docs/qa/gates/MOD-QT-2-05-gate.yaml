# ---------------------------------------------------------------------------
# VERIFICAÇÕES OBRIGATÓRIAS E INDEPENDENTES (7 pontos)
# ---------------------------------------------------------------------------
verificacoes_independentes:
  - id: V1
    item: "Leitura do arquivo real — ordem final, texto, `to`/`params` e integridade dos 5 links pré-existentes"
    resultado: PASS
    metodo: "Read integral de src/routes/projetos.$projetoId.tsx (146 linhas)"
    evidencia: >-
      Bloco `<div className="deps-hero-links">` nas linhas 81-112. Ordem final dos 6 links
      confere byte a byte com a exigida pela AC3:
      (1) L82-88 `<Link to="/projetos/$projetoId/padrao-entrada" params={{ projetoId }}
      className="deps-hero-link">` → "Padrão de entrada";
      (2) L89-95 `<Link to="/projetos/$projetoId/correntes" ...>` → "Correntes (IB)";
      (3) L96-98 `<a href={`/projetos/${projetoId}/dimensionamento-condutores`}
      className="deps-hero-link">` → "Dimensionamento de condutores";
      (4) L99-105 **NOVO** `<Link to="/projetos/$projetoId/queda-tensao"
      params={{ projetoId }} className="deps-hero-link">` → "Queda de tensão";
      (5) L106-108 `<a href={`/projetos/${projetoId}/circuitos`} ...>` → "Planejador de circuitos";
      (6) L109-111 `<a href={`/projetos/${projetoId}/unifilar`} ...>` → "Unifilar".
      O novo link é estruturalmente idêntico ao padrão de referência da Dev Note (mesma
      indentação, mesma ordem de props `to`/`params`/`className`, mesmo rótulo com acentuação
      correta "Queda de tensão"). Os 5 pré-existentes conferem com o "antes" documentado pela
      story (§ "Evidência", linhas 20-26) e pelo registro de validação do @po.

  - id: V2
    item: "git diff reexecutado pelo @qa — delimitação real do diff"
    resultado: PASS
    metodo: "`git diff --numstat` e `git diff` sobre o arquivo, executados pelo @qa"
    evidencia: >-
      `git diff --numstat -- 'src/routes/projetos.$projetoId.tsx'` → `7  0  <arquivo>`.
      **+7 / -0 CONFIRMADO** — o número do @dev está correto. O hunk único é
      `@@ -96,6 +96,13 @@`, contendo exclusivamente as 7 linhas do novo `<Link>`, ancorado
      entre o `</a>` de "Dimensionamento de condutores" e o `<a>` de "Planejador de circuitos".
      Zero linhas de remoção ⇒ nenhum dos 5 links pré-existentes foi editado, movido ou
      removido. R2 (migrar `<a href>` vizinhos "de brinde") comprovadamente NÃO ocorreu.

  - id: V3
    item: "Teste novo — leitura crítica + execução isolada"
    resultado: PASS
    metodo: "Read de tests/ui/projeto-detalhe-nav-links.test.ts + `npx vitest run <arquivo>`"
    evidencia: >-
      Execução isolada: **Test Files 1 passed (1) | Tests 3 passed (3) | exit 0 | 897ms**.
      Leitura crítica: o teste NÃO é um "arquivo existe". Ele extrai o bloco entre
      `<div className="deps-hero-links">` e o `</div>` correspondente e assere:
      (AC1) `toContain("Queda de tensão")` + `className="deps-hero-link"` no trecho da tag;
      (AC2) localiza a tag de abertura via `lastIndexOf("<Link", indiceRotulo)` e assere
      `to="/projetos/$projetoId/queda-tensao"` **e** `params={{ projetoId }}` — ou seja, prova
      que o rótulo está dentro de um `<Link>` do TanStack Router, não de um `<a>`;
      (AC3) mapeia os 6 rótulos a posições e exige que o vetor de posições seja **estritamente
      crescente** na ordem canônica, mais a presença literal dos 5 destinos pré-existentes
      (2 `to="..."` + 3 `href={`...`}`). Cobre texto, destino, tipo de elemento e ordem — que
      é exatamente o que as ACs pedem. Conformidade com a proibição do @po: usa apenas
      `readFileSync` + `vitest`; nenhum import de Testing Library, jsdom ou happy-dom.

  - id: V-LINT-CAUSA
    item: "Reprodução independente do caveat de lint E verificação da causa alegada"
    resultado: PASS_COM_RESSALVA
    metodo: "3 execuções de eslint pelo @qa + contagem de bytes CR worktree × blob HEAD"
    evidencia: >-
      (a) `npx eslint 'src/routes/projetos.$projetoId.tsx' tests/ui/projeto-detalhe-nav-links.test.ts`
      → **exit 1, ✖ 146 problems (146 errors, 0 warnings)**. Contagem do @dev CONFIRMADA.
      100% das 146 são `prettier/prettier — Delete ␍`; nenhuma outra regra aparece. O arquivo
      de teste novo NÃO é listado (0 erros, limpo mesmo com prettier ligado).
      (b) Distribuição verificada linha a linha: 146 linhas distintas reportadas, de `1:34` a
      `146:2`, ou seja **uma por linha do arquivo inteiro** (o arquivo tem 146 linhas).
      **139 das 146 estão FORA do intervalo 99-105 das linhas novas.** A alegação "não são das
      7 linhas novas" está correta.
      (c) `npx eslint --rule '{"prettier/prettier":"off"}'` sobre os 2 arquivos → **exit 0**,
      sem saída. Confirma: zero violação de regra real.
      (d) **VERIFICAÇÃO DA CAUSA — não aceita por alegação.** `git config core.autocrlf` = `true`.
      Blob no HEAD: **0 bytes CR** (LF puro). Worktree: **146 bytes CR** para 146 linhas.
      A prova decisiva, que o @dev não apresentou: executei o mesmo eslint sobre
      **`src/routes/index.tsx`, arquivo LIMPO em `git status` (zero modificações, nenhuma
      relação com esta nem com qualquer story pendente)** → **exit 1, ✖ 140 problems, 140/140
      `prettier/prettier`**, com 140 bytes CR na worktree. O mesmo modo de falha existe em
      arquivo que ninguém tocou ⇒ é condição da worktree, **não** artefato introduzido por
      esta story. Contraprova complementar: `src/routes/__root.tsx` (também limpo) tem 0 CR e
      passa em exit 0 — a worktree tem line endings mistos, o que descarta qualquer atribuição
      da condição à edição desta entrega.
      VEREDITO SOBRE A ALEGAÇÃO DO @dev: **sustentada.** Não é FAIL. Impacto funcional nulo:
      `git diff` (que normaliza sob autocrlf) já mostra +7/-0 sem ruído de fim de linha, logo
      o conteúdo que será commitado é LF puro.
    ressalva: "`npx eslint .` (projeto inteiro) permanece NÃO VERIFICADO — trava ambiental pré-existente. NÃO presumido PASS. Única razão do CONCERNS."

  - id: V5
    item: "Suíte completa — baseline preservado"
    resultado: PASS
    metodo: "`npx vitest run` executado integralmente pelo @qa (sem --reporter=basic)"
    evidencia: >-
      **Test Files 133 passed (133) | Tests 950 passed (950) | 0 falhas | exit 0 | 199,36s.**
      Número do @dev CONFIRMADO. Baseline anterior do ciclo era 947/947 em 132 arquivos
      (gate MOD-QT-2-04, 3 execuções); agora 950 em 133 = +3 testes e +1 arquivo, exatamente
      os do teste novo. Nenhum teste desapareceu, nenhum passou a falhar. R5 não ocorreu.
      BLK-QT-TIMEOUT-FLAKY-01 não reproduzido nesta execução (4ª consecutiva sem repro).

  - id: V6
    item: "tsc --noEmit e vite build"
    resultado: PASS
    metodo: "Ambos executados pelo @qa"
    evidencia: >-
      `npx tsc --noEmit` → **exit 0**, sem saída. Isto é a prova de tipo da AC2: o `to` do
      `<Link>` do TanStack Router é type-checked contra a route tree gerada; o literal
      `/projetos/$projetoId/queda-tensao` compila, logo existe e está grafado corretamente
      (R3 mitigado — um `$projetoId_` ou typo quebraria aqui).
      `npx vite build` → **exit 0, ✓ built in 8.22s**. R4 (divergência SSR × SPA) coberto.

  - id: V7
    item: "Nenhum arquivo fora de escopo tocado"
    resultado: PASS
    metodo: "Atribuição por mtime (worktree suja com trabalho de outros épicos) + `git status` por caminho"
    evidencia: >-
      `git diff --stat` isolado não é conclusivo aqui: a worktree do submódulo está suja com
      ~57 arquivos de MOD-CC/AUTO-OTI/tutoriais. A delimitação foi feita por mtime na janela
      desta story: `find src tests -type f -newermt "2026-07-29 10:00"` retorna
      **EXATAMENTE 2 arquivos**: `src/routes/projetos.$projetoId.tsx` e
      `tests/ui/projeto-detalhe-nav-links.test.ts`. Nada mais.
      Confirmações por caminho (`git status --short`): `src/domain/queda-tensao/` → limpo;
      `src/routes/projetos.$projetoId_.queda-tensao.tsx` → limpo; `src/routeTree.gen.ts` →
      limpo; `src/routeTree.spa.ts` → limpo. `vitest.config.*` → **não existe** (nenhum foi
      criado). `tests/ui/__snapshots__/` → 5 snapshots, nenhum do hub; o único modificado
      (`correntes-rastreabilidade`) tem mtime fora da janela desta story (trabalho alheio) —
      nenhum snapshot foi criado ou regenerado por esta entrega.
      **package.json**: aparece como `M` em `git status`, mas o `git diff` mostra que a
      alteração é a adição de 2 scripts `docs:tutorial:check|update` (trabalho de tutoriais
      MOD-DC, alheio a esta story); o bloco `dependencies` está **intocado**. Varredura por
      `testing-library|jsdom|happy-dom` em package.json → **NENHUMA ocorrência**. R1
      comprovadamente não ocorreu.
      Registro em ambas as route trees confirmado por grep: `routeTree.gen.ts` 25 ocorrências,
      `routeTree.spa.ts` 5 — nenhuma das duas foi editada por esta story.

