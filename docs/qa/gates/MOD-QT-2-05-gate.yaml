top_issues:
  - id: "MNT-005"
    severity: low
    finding: >-
      `npx eslint .` (projeto inteiro) permanece NÃO VERIFICADO por trava ambiental
      pré-existente, independente desta story. Herdado de MOD-QT-2-03/-04 (MNT-003).
    suggested_action: >-
      Débito de infraestrutura de qualidade para @devops. Nenhum arquivo desta story está
      sem cobertura de lint — ambos foram verificados individualmente.

  - id: "MNT-006"
    severity: low
    finding: >-
      Worktree do submódulo com line endings mistos sob `core.autocrlf=true`: parte dos
      arquivos carrega CRLF (ex.: `src/routes/index.tsx`, 140 CR, sem nenhuma modificação
      pendente) e parte carrega LF (`src/routes/__root.tsx`, 0 CR). Isso faz o `eslint`
      escopado falhar em exit 1 com ruído puramente cosmético e obriga cada gate do ciclo a
      re-provar que a falha é ambiental. Não é defeito desta story.
    suggested_action: >-
      @devops: adicionar `.gitattributes` com `* text=auto eol=lf` (ou `core.autocrlf=input`)
      e normalizar a worktree em um commit dedicado, fora de qualquer story. Elimina a caveat
      de forma permanente para todo o repositório.

  - id: "DBT-005"
    severity: low
    finding: >-
      Inconsistência de navegação pré-existente: no mesmo bloco, 3 links continuam usando
      `<a href>` (full-page reload) enquanto 3 usam `<Link>` (client-side). O novo link fica
      entre dois `<a href>`. Drift do commit `1e18cc9`, confirmado pelo @po; deliberadamente
      fora de escopo desta story (AC3 veta tocar nos 5 pré-existentes).
    suggested_action: "Backlog de @po: story dedicada de migração dos 3 `<a href>` para `<Link>`."

  - id: "OPS-001"
    severity: low
    finding: "BLK-QT-TIMEOUT-FLAKY-01 não reproduzido — 4ª execução completa consecutiva sem repro. Causa estrutural inalterada."
    suggested_action: "Blocker mantido aberto, severidade BAIXA. Ver docs/qa/gates/MOD-QT-2-03-gate.yaml."

