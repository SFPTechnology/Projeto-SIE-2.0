artigo_iv_avaliacao:
  resultado: PASS
  pergunta: "O registro 'ausência de origem documental' é honesto e suficiente?"
  verificacao_independente_do_qa:
    - "Re-executado `git log --oneline -- src/domain/calculo/derivar-circuitos.ts`: 7 commits (cb782d6, e7431ca, 5374f45, 574ef8d, 3d59bfb, 4c186a3, 80727db) — exatamente os 7 que o @dev listou. Nenhum inventado, nenhum omitido."
    - "Busca no corpo E assunto de todas as mensagens desses commits por 'resultado|guard|!r|rascunho': nenhuma ocorrência. A afirmação do @dev é verificável e correta."
    - "O diff do src/ segue não commitado (confirmado nesta sessão), logo não existe mensagem de commit, PR ou revisão que possa carregar a motivação. A ausência é estrutural, não fruto de busca preguiçosa."
  honestidade: >-
    O @dev registrou a ausência em vez de fabricar uma justificativa plausível — que teria sido
    fácil, dado que a coerência arquitetural (cargas-adicionais.ts nunca dependeu de `resultado`)
    ofereceria uma narrativa convincente. Ele explicitamente NÃO fez isso, e ainda distinguiu
    corroboração de autorização. É exatamente o comportamento que o Artigo IV exige.
  suficiencia: >-
    SUFICIENTE. A conformidade da story não repousa sobre o Dev Agent Record: repousa sobre PP-1,
    declarado pelo @po com fonte primária datada (decisão do usuário) e limite anti-invenção
    explícito. A Task 5 é registro complementar, como o próprio @po rebaixou. O @dev cumpriu a
    forma prescrita ("comportamento preservado por decisão do usuário; nenhuma AC/epic de origem
    localizada além desta story") literalmente.
  ressalva_do_qa: >-
    PP-1 é um requisito PROSPECTIVO sobre um comportamento observado. Isso é legítimo e está
    corretamente rotulado como tal na story. Vale registrar que a story documenta com precisão o
    que NÃO sabe (a motivação histórica do autor da mudança permanece desconhecida) — essa
    honestidade é o que torna a regularização defensável sob o Artigo III.

