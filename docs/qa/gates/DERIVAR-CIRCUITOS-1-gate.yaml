# Rastreabilidade AC → teste (verificada contra o ARQUIVO, não contra a descrição)
# ---------------------------------------------------------------------------
trace_ac:
  - ac: AC1
    descricao: "Dependência sem resultado e com cargas adicionais válidas emite somente circuitos ADD-*"
    resultado: PASS
    teste: 'tests/domain/calculo/derivar-circuitos.test.ts:88 — it("dependência sem resultado emite apenas circuitos de carga adicional (AC1)")'
    evidencia_lida_no_arquivo: >-
      Linhas 89-106: chama derivarCircuitos([{ entrada: entradaSala }], padraoBi);
      expect(ids).toEqual(["ADD-Sala-Chuveiro","ADD-Sala-Lampada"]);
      not.toContain("ILUM-Sala"); not.toContain("TUG-Sala");
      chuveiro: tipo "tue", 5600 VA, 220 V, tensao_resolucao.origem "declarada", cargas[0].trifasica false;
      lâmpada: tipo "iluminacao", 200 VA, 127 V.
      Todos os valores conferem com o Gherkin do AC1 e com evidencia.teste_falhando.observado
      (versão corrigida pelo @po: 2 circuitos, não 1).
    cobertura: COMPLETA

  - ac: AC2
    descricao: "Dependência sem resultado e sem cargas adicionais retorna lista vazia"
    resultado: PASS
    teste: 'tests/domain/calculo/derivar-circuitos.test.ts:109 — it("dependência sem resultado e sem cargas adicionais retorna lista vazia (AC2)")'
    evidencia_lida_no_arquivo: >-
      Linhas 110-115: DUAS variantes assertadas — cargasAdicionais: [] e cargasAdicionais
      ausente (rest destructuring que omite a chave). Ambas toEqual([]).
      O AC pedia "[] (ou ausente)"; o teste cobre literalmente as duas alternativas do "ou",
      o que é o mínimo do AC e não excesso — cobertura fiel.
    cobertura: COMPLETA

  - ac: AC3
    descricao: "Dependência com resultado mantém comportamento inalterado (não regressão)"
    resultado: PASS
    metodo: "Verificação por DIFF, não por confiança na descrição do @dev."
    evidencia_lida_no_arquivo: >-
      `git diff HEAD -- tests/domain/calculo/derivar-circuitos.test.ts` = 50 inserções /
      2 deleções. As 2 deleções são EXATAMENTE as duas linhas do `it("dependência sem resultado
      é ignorada")` antigo. Nenhuma linha de qualquer outro `it` aparece no diff — os 11 testes
      pré-existentes estão intocados, incluindo asserções e fixtures (padraoBi, entradaSala,
      resultadoSala, ref()). Execução: 14 passed = 11 originais + 3 novos.
    cobertura: COMPLETA

  - ac: AC4
    descricao: "vIlumTug ausente continua sendo skip total, independente de resultado ou cargas"
    resultado: PASS
    teste: 'tests/domain/calculo/derivar-circuitos.test.ts:118 — it("vIlumTug ausente pula a dependência mesmo com resultado e cargas adicionais (AC4)")'
    evidencia_lida_no_arquivo: >-
      Linhas 120-133: fixture padraoTriSemFaseNeutro (sistema "tri", tensoes_ofertadas [220,380],
      tensao_fase_fase 380, SEM tensao_fase_neutro) combinado com resultado: resultadoSala e as
      cargas adicionais de entradaSala → toEqual([]).
      Confirma que o guard `if (!vIlumTug) continue;` (linha 99 do módulo) permanece absoluto,
      que é precisamente a metade do guard original que a mudança não commitada PRESERVOU.
      Este é o teste de maior valor da story: protege o único invariante que sobrou.
    cobertura: COMPLETA

  ac_gaps: []

