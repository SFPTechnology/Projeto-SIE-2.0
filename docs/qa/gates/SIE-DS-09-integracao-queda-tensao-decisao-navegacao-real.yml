schema: 1
story: "SIE-DS-09"
story_title: "Integração: queda de tensão completa (parâmetros, resultado, decisão) + navegação real"
story_path: "docs/stories/story-SIE-DS-09-integracao-queda-tensao-decisao-navegacao-real.md"
gate: CONCERNS
status_reason: >-
  AC1-AC12, AC14 atendidos e verificados de forma independente por @qa
  (build SSR+SPA, typecheck, lint, testes — todos rerodados, não apenas
  aceitos do relato do @dev). Durante a revisão de código, @qa encontrou um
  bug real (não cosmético) em DecisionPanel: o estado das mutations
  simular/aplicar não era resetado ao trocar de circuito selecionado,
  permitindo exibir cenários simulados de um circuito como se fossem de
  outro e, ao confirmar, aplicar a seção simulada do circuito ERRADO ao
  `circuito_id` do circuito atual — risco de dado incorreto em um sistema de
  dimensionamento NBR 5410. Corrigido por @qa nesta revisão (useEffect de
  reset por circuito_id), com typecheck/lint/testes reverificados verdes
  após a correção. CONCERNS mantido por: (1) CodeRabbit indisponível (11ª
  story consecutiva); (2) fluxo completo simular→escolher→justificar→aplicar
  não pode ser testado automaticamente neste projeto (sem jsdom/Testing
  Library, só renderToStaticMarkup) — limitação de toolchain, declarada, não
  mascarada; (3) routeTree.spa.ts precisou de edição manual (normalmente
  gerado) para a tipagem de useNavigate() funcionar — funcionalmente
  verificado (build SPA passa), mas é uma fragilidade de manutenção a
  observar se o projeto ganhar um gerador de rotas dedicado.
reviewer: "Quinn (Test Architect)"
