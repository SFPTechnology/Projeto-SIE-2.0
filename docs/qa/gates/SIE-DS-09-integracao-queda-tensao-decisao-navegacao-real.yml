  bug_encontrado_e_corrigido: "src/components/command-center/DecisionPanel.tsx — useEffect adicionado para resetar simular/aplicar (mutation.reset()), opcaoSelecionadaId e justificativa quando circuito?.circuito_id muda. Sem isso, trocar de circuito no EngineeringPanel mantinha a UI do DecisionPanel mostrando cenários do circuito anterior."
  ac1_ac3_parametros_resultado: "ParameterPanel/ResultSummary via props reais (rastreio.V_nominal/familia_id/topologia_coluna_id, ResultadoInternoQuedaTensao); vocabulário 'B1' confirmado ausente em ParameterPanel.test.tsx"
  ac4_ac7_simulacao_decisao: "DecisionPanel usa cenariosSugeridos()/PARAMETROS_MOD_DC_PADRAO reais (mesmo helper da tela de produção projetos.$projetoId_.queda-tensao.tsx); aplicarCenarioQuedaTensao real grava QUEDA_TENSAO_CENARIO_APLICADO por construção (mesma função de serviço da tela legada, confirmado em código — servico-queda-tensao.ts linha ~515)"
  ac6_excecao_ui: "Campo de justificativa é a única exceção de CSS/UI de toda a implantação — confirmado: apenas DecisionPanel.css recebeu regras novas, documentadas como exceção explícita no próprio arquivo"
  ac8_ac9_navegacao: "module-navigation-data.ts com 'to' por item, item Diagnóstico removido (decisão @po confirmada: ModuleNavigation.test.tsx assevera ausência); navegação via callback aoNavegar (não useNavigate() dentro do organism — decisão correta de @dev para não quebrar renderToStaticMarkup sem RouterProvider, verificada por leitura de código)"
  ac10_unifilar: "UnifilarPreviewSection recebe correntes/dependencias/capacidadesExport via props; unifilar-preview-fixture.ts confirmado removido (arquivo ausente)"
  ac12_zero_legado: "git diff vazio para AppShell.tsx e src/components/unifilar/**; diff em src/domain/** e rotas legadas confirmado pré-existente (mesmo achado de SIE-DS-08)"
  ac13_coderabbit: "Confirmado indisponível por @qa: wsl bash -c '~/.local/bin/coderabbit --prompt-only -t uncommitted' → Illegal instruction (core dumped)"

