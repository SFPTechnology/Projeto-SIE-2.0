      "AC10 / CA-QT-12: fonte da resposta propaga [VERIFICAR]..." no endpoint. Ambos passando.

  - id: 4
    criterio: "CA-QT-19 (não-regressão) e CA-QT-21/CA-QT-22 (limite EDP 1% e [VERIFICAR] do total)"
    resultado: PASS
    evidencia: >-
