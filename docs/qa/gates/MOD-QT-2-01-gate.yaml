divergencias_po:
  - id: PO-DIV-01
    severidade_original: MEDIA
    status: RESOLVIDA_PARCIALMENTE_E_RECLASSIFICADA
    achado_original: >-
      Handoff do @dev afirma "793 testes / 0 falhando"; @po observou "Test Files: 1 failed |
      122 passed" por falha de COLETA (arquivo vazio, "No test suite found in file").
    observado_por_qa: >-
      A falha mudou de natureza. O arquivo foi restaurado (281 linhas) e agora a suíte COLETA
      normalmente — mas 1 teste REALMENTE FALHA por assertiva de comportamento. A contagem
      atual é 833 testes (1 falha) em 126 arquivos (1 falho), exit 1.
      A crítica do @po ao registro do @dev procede e foi mantida: `test: PASS` no handoff
      dev-to-qa NÃO deve ser aceito sem qualificação. A contagem de "336 arquivos" do @dev
      também não se reproduz (126 arquivos de teste).
    acao: >-
      Registrado como issue de severidade HIGH com owner FORA destas stories (ver top_issues
      QT201-001). Não penaliza o veredito das stories, mas BLOQUEIA o commit do worktree.

  - id: PO-DIV-02
    severidade_original: ALTA
    status: RESOLVIDA
    achado_original: >-
      tests/domain/calculo/derivar-circuitos.test.ts com 0 linhas na worktree contra 281 no HEAD
      (281 deletions não commitadas) — regressão silenciosa de cobertura.
    verificado_por_qa: >-
      `wc -l` = 281 linhas e `git diff --stat` do arquivo SEM SAÍDA (idêntico ao HEAD).
      A deleção foi revertida. A cobertura de derivar-circuitos está de volta e executando.
    consequencia: >-
      A restauração do arquivo é a causa direta da falha do critério 6 (test): com a suíte de
      volta, ela passou a denunciar a regressão real que existia em
      src/domain/calculo/derivar-circuitos.ts. O achado do @po estava correto e a resolução
      dele expôs um segundo defeito, maior. Escalado como QT201-001.

