  - id: 3
    criterio: "Resultado com valores [VERIFICAR] propaga a marcação no campo fonte (CA-QT-12)"
    resultado: PASS
    evidencia: >-
      `construirFonte()` (motor-queda-tensao.ts:455-489) emite `R={R}Ω/km {status_resistencia}`,
      com status vindo do registro de impedância — sempre "[VERIFICAR]" hoje. Teste
