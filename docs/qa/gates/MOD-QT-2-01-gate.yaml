      CA-QT-21: limite 1,0% via `limiteDoTrechoPct()` quando origem contém RAMAL-ENTRADA-EDP.
      CA-QT-22: `MARCACAO_VERIFICAR_ALINEA` aplicada quando limite total ∈ {5,0; 7,0}.

